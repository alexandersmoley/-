<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Превью сайта наблюдателей 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
    /* Oswald подтянется из сети, если она есть; иначе — системный гротеск,
       суженный по горизонтали, чтобы держать пропорции оригинала. */
    :root {
        --red: #E60000;
        --black: #0a0a0a;
        --white: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }

    body {
        display: grid;
        grid-template-columns: 1fr 430px;
        grid-template-rows: 630px;
        align-items: stretch;
        background: var(--white);
        font-family: 'Oswald', 'DejaVu Sans', sans-serif;
        color: var(--black);
    }

    .left {
        height: 630px;
        position: relative;
        padding: 50px 46px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
    }

    .ghost {
        position: absolute;
        bottom: -60px;
        right: -40px;
        font-size: 270px;
        font-weight: 700;
        color: rgba(0, 0, 0, 0.045);
        line-height: 1;
        letter-spacing: -8px;
    }

    .stamp {
        border: 4px solid var(--red);
        color: var(--red);
        padding: 8px 18px;
        font-weight: 700;
        text-transform: uppercase;
        transform: rotate(-3deg);
        margin-bottom: 34px;
        font-size: 21px;
        width: fit-content;
        letter-spacing: 3px;
        position: relative;
        z-index: 2;
    }

    h1 {
        font-weight: 700;
        text-transform: uppercase;
        font-size: 82px;
        line-height: 1.0;
        letter-spacing: -1px;
        position: relative;
        z-index: 2;
        transform: scaleX(0.88);
        transform-origin: left center;
    }

    h1 .hl {
        display: inline-block;
        background: var(--red);
        color: var(--white);
        padding: 10px 14px 2px;
        margin: -8px 0 -2px -6px;
        line-height: 0.9;
    }

    .sub {
        margin-top: 30px;
        font-size: 23px;
        line-height: 1.3;
        font-weight: 500;
        color: #2b2b2b;
        border-left: 7px solid var(--black);
        padding-left: 18px;
        position: relative;
        z-index: 2;
        max-width: 600px;
    }

    .right {
        height: 630px;
        background: var(--red);
        border-left: 8px solid var(--black);
        position: relative;
        overflow: hidden;
        padding: 50px 32px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
    }

    .right::before {
        content: "";
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 18px;
        background: repeating-linear-gradient(
            45deg,
            var(--black), var(--black) 9px,
            var(--red) 9px, var(--red) 18px
        );
    }

    .right::after {
        content: "★";
        position: absolute;
        bottom: -120px;
        right: -90px;
        font-size: 340px;
        color: rgba(0, 0, 0, 0.12);
        line-height: 1;
    }

    .cta {
        font-size: 34px;
        font-weight: 700;
        text-transform: uppercase;
        line-height: 1.06;
        color: var(--black);
        position: relative;
        z-index: 2;
        transform: scaleX(0.9);
        transform-origin: left center;
    }

    .site {
        margin-top: 26px;
        background: var(--black);
        color: var(--white);
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 1px;
        padding: 13px 20px;
        position: relative;
        z-index: 2;
    }
</style>
</head>
<body>
    <div class="left">
        <div class="ghost">2026</div>
        <div class="stamp">Выборы 2026</div>
        <h1>Ловите<br><span class="hl">нарушителей</span><br>за&nbsp;руку</h1>
        <div class="sub">Выборы Госсовета и&nbsp;Госдумы. Проследите за&nbsp;честностью голосования на&nbsp;своём участке.</div>
    </div>

    <div class="right">
        <div class="cta">Станьте<br>наблюдателем<br>от&nbsp;КПРФ</div>
        <div class="site">nabl21.ru</div>
    </div>
</body>
</html>

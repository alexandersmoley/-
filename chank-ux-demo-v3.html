/* Chat-first layout: retained five-section navigation, conversation is the primary workspace */
.content.chat-mode{max-width:none;margin:0;padding:0;height:calc(100dvh - 68px);min-height:420px;overflow:hidden;background:#fff}
.content.chat-mode #view{height:100%}

.chat-workspace{display:flex;flex-direction:column;height:100%;background:#fff;min-width:0}
.chat-topbar{height:57px;flex:none;border-bottom:1px solid #eff1ed;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 25px;color:var(--ink)}
.chat-topbar strong{font-size:15px;font-weight:700}
.chat-topbar .chat-sub{color:#7b857c;margin-left:9px;font-size:12px}
.chat-topbar .btn{background:transparent;border-color:#e5eae4}
.chat-topbar .btn:disabled{opacity:.4}
.chat-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:#dfe5df transparent}
.chat-thread{max-width:794px;margin:0 auto;padding:38px 22px 32px;display:flex;flex-direction:column;gap:26px;min-height:100%}
.chat-intro{text-align:center;margin:auto auto 28px;max-width:600px;padding:16px 0 0}
.chat-intro h1{font-size:clamp(27px,3vw,34px);font-weight:620;letter-spacing:-.047em;margin:0 0 10px}
.chat-intro p{font-size:14px;color:var(--muted)}
.chat-msg{width:100%;display:flex;min-width:0}
.chat-msg.user{justify-content:flex-end}
.chat-msg .chat-user-text{padding:12px 17px;border-radius:20px;background:#eef1eb;max-width:min(74%,520px);white-space:pre-wrap;line-height:1.58;overflow-wrap:anywhere}
.chat-msg.assistant{justify-content:flex-start}
.chat-msg .chat-answer{width:100%;max-width:750px;min-width:0}
.chat-answer .speaker{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:#566b5d;font-weight:700}
.chat-answer .speaker .ai-mark{width:21px;height:21px;display:grid;place-items:center;border:1px solid #c4d4c0;border-radius:7px;font-size:12px;background:#f1f5ee;color:#2f5135}
.chat-answer p{font-size:15px;line-height:1.65;white-space:pre-wrap}
.chat-choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}

.chat-choices button:hover{background:#eff5ec}
.chat-empty-start{display:flex;flex-direction:column;gap:26px;margin:auto 0}
.chat-empty-start .chat-choices{justify-content:center}
.chat-empty-start .chat-choices button{background:#f9fbf7}
.wizard-message{display:flex;gap:0;min-width:0}
.wizard-message .chat-answer{width:100%;min-width:0}
.wizard-card{margin-top:8px;border:1px solid #dfe5dc;background:#fafbf8;border-radius:18px;padding:20px;max-width:700px}
.wizard-card h2{font-size:21px}
.wizard-card .form{gap:14px}
.wizard-card .form .btn{min-height:42px}
.wizard-controls{border-top:1px solid #e6eae3;display:flex;justify-content:space-between;padding-top:11px;margin-top:16px}
.wizard-controls .btn{min-width:90px}
.chat-composer-zone{flex:none;width:100%;padding:10px 22px 19px;background:#fff}
.chat-composer-inner{max-width:794px;margin:0 auto}
.chat-composer{border:1px solid #d9e1d7;border-radius:24px;box-shadow:0 3px 16px #23372c0a;background:#f8f9f6;padding:9px 9px 9px 15px;display:flex;align-items:flex-end;gap:9px}
.chat-composer:focus-within{border-color:#9aaf98;box-shadow:0 0 0 2px #ceddc84d}
.chat-composer textarea{resize:none;width:100%;min-height:47px;max-height:160px;background:transparent;border:0;outline:0;padding:13px 4px 10px;color:var(--ink);font-size:15px;line-height:1.48;box-shadow:none}
.chat-composer textarea:focus{outline:0}
.chat-composer button{flex:none;border:0;display:grid;place-items:center;cursor:pointer}
.chat-composer .attach{height:36px;width:36px;border:1px solid #e1e7de;background:white;border-radius:50%;font-size:22px;line-height:1;color:#385141;margin-bottom:5px}
.chat-composer .send{height:39px;width:39px;border-radius:50%;background:var(--pine);color:#fff;font-size:20px;line-height:1;margin-bottom:4px}

.chat-footnote{text-align:center;color:#859188;font-size:11px;margin-top:8px}

 .content.chat-mode{height:calc(100dvh - 52px - 52px - 63px - env(safe-area-inset-bottom));min-height:200px;padding:0}

}
@media(max-width:630px){

/* UX iteration: two business processes, one next action at a time */
.entry-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;margin:22px auto 0}
.entry-grid button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:165px;border:1px solid #d9e3d8;background:#fbfcf9;border-radius:18px;padding:19px;text-align:left;color:#202c25}
.entry-grid button:hover,.entry-grid button:focus-visible{border-color:#59826a;background:#f0f6ed}
.entry-grid .entry-icon{width:36px;height:36px;border-radius:11px;background:#e3eddf;display:grid;place-items:center;color:#284b35}
.entry-grid .entry-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.entry-grid strong{font-size:18px;line-height:1.25;letter-spacing:-.035em}
.entry-grid small{font-size:13px;color:#58665b;line-height:1.5}
.entry-grid .entry-tail{font-size:12px;font-weight:700;color:#335f41;margin-top:auto}
.entry-help{font-size:12px;color:#7c877d;text-align:center;margin:12px 0 0}
.workflow-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:17px}
.workflow-list button{border:1px solid #dbe2d8;background:#f8faf5;border-radius:12px;text-align:left;padding:12px;min-height:64px;color:inherit}
.workflow-list button[aria-pressed=true]{border-color:#518165;background:#e8f2e5}
.workflow-list button strong{display:block;font-size:14px}
.workflow-list button small{font-size:11px}
.next-action{padding:16px 18px;border:1px solid #cbdcca;background:#f1f6ee;border-radius:13px}
.next-action strong{display:block;margin-bottom:6px;font-size:15px}
.next-action p{font-size:13px;line-height:1.5;color:#496150}
.process-switcher{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.process-switcher button{display:block;text-align:left;padding:13px;background:#f8faf7;color:#263b2d;border:1px solid #dbe2d8;border-radius:12px;min-height:61px}

/* Completion appears within a run, not in a new navigation section */
.finish{display:grid;gap:17px;max-width:940px}
.finish-head{padding:25px;background:#edf5eb;border:1px solid #c9ddc7;border-radius:17px}
.finish-kicker{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750;color:#386647}

.finish-summary div{border:1px solid #e0e5dc;border-radius:11px;padding:12px;background:#fff;min-width:0}
.finish-summary dt{font-size:11px;color:#778377;margin-bottom:5px}
.finish-summary dd{margin:0;font-weight:650;overflow-wrap:anywhere;font-size:13px}
.result-document{border:1px solid #dce5d9;border-radius:16px;background:white;padding:22px}
.result-document header{margin-bottom:18px;padding-bottom:15px;border-bottom:1px solid #e3e9e0}
.result-document header small{display:block;margin:0 0 8px}
.result-document h2{font-size:clamp(20px,3vw,27px);margin-bottom:7px}
.result-document h3{font-size:16px;margin:18px 0 6px}
.result-document p{line-height:1.7;margin:0 0 11px;max-width:70ch}

 const description=blog?'Статья прошла согласование и размещение в учебном блоге. Ниже — полный текст, который получил бы редактор.':'Проверка нашла устаревшие сведения. Изменение согласовано и подтверждено учебной CMS. Ниже — что именно обновлено.';
 const summary='<div class="finish-summary"><div><dt>Процесс</dt><dd>'+types[state.activeType]+'</dd></div><div><dt>Результат запуска</dt><dd>'+(blog?'1 статья':'1 обновлённая страница')+'</dd></div><div><dt>Статус</dt><dd>Подтверждён в демо</dd></div></div>';
 const blogBody='<article class="result-document"><header><small>Учебный опубликованный материал · /blog</small><h2>Как проверить актуальность информации на сайте</h2><p class="result-url">https://sever.example/blog/kak-proverit-aktualnost</p></header><p>Информация на корпоративном сайте устаревает: меняются условия, цены, характеристики и контакты. Поэтому важно не только выпускать новые статьи, но и регулярно проверять опубликованные сведения.</p><h3>1. Найдите исходный документ</h3><p>Для каждого утверждения определите первоисточник: договор, продуктовую документацию или утверждённые условия обслуживания. Если источника нет или версии противоречат друг другу, материал требует ручной проверки.</p><h3>2. Сравните факты и даты</h3><p>Проверьте, какие сведения изменились и когда. Отделите подтверждённые изменения от предположений, а затем подготовьте редактору список корректировок со ссылками на источники.</p><h3>3. Согласуйте изменения до публикации</h3><p>Редактор проверяет формулировки и подтверждает итоговую версию. Только после согласования материал можно передать в CMS и убедиться, что опубликованная страница соответствует принятому тексту.</p></article>';
 const siteBody='<section class="result-document"><header><small>Учебная обновлённая страница · /delivery</small><h2>Условия доставки</h2><p class="result-url">https://sever.example/delivery</p></header><div class="compare"><div><h3>Было</h3><p>Доставка занимает до 7 рабочих дней.</p></div><div><h3>Стало</h3><p>Доставка занимает до 5 рабочих дней.</p></div></div><h3>На основании чего</h3><p>Условия доставки · версия 4. Обновлена только информация о сроке доставки; остальные разделы учебной страницы остались без изменений.</p></section>';
 const next=s?.mode==='recurring'?'Процесс остаётся настроенным на регулярную работу. В реальном сервисе следующий цикл начнётся по расписанию. В этой демоверсии автоматические запуски выключены.':'Процесс сохранён. Следующий цикл можно начать вручную из «Автоматизаций».';
 const other=blog?'site':'blog',otherAction=state.slots[other].scenario?'auto':'start:'+other;
 const controls='<div class="finish-actions">'+action('auto','К моим процессам','primary')+action('chat','Вернуться в чат')+action(otherAction,state.slots[other].scenario?'Посмотреть второй процесс':'Настроить '+(blog?'актуализацию':'блог'))+'</div>';
 return '<div class="finish"><div class="finish-head"><div class="finish-kicker"><span aria-hidden="true">✓</span> Учебный запуск завершён</div><h2>'+title+'</h2><p>'+description+'</p></div>'+summary+(blog?blogBody:siteBody)+panel('<div class="next-action"><strong>Что дальше?</strong><p>'+next+'</p></div><p class="muted" style="margin-top:10px">Это демонстрация: на настоящем сайте ничего не публиковалось.</p><div class="actions">'+controls+'</div>')+'</div>';
}
function review(){
 const r=state.run;let c;
 const switcher='<div class="process-switcher">'+Object.entries(types).map(([id,title])=>{const slot=state.slots[id];return '<button type="button" data-action="choose-review:'+id+'" aria-pressed="'+(id===state.activeType)+'"><strong>'+title+'</strong><small>'+(slot.run?runLabels[slot.run.status]:'Нет материалов')+'</small></button>'}).join('')+'</div>';
 if(r?.status==='confirmed')return heading('Задача завершена','Итог запуска и полученный материал')+'<div class="layout"><div class="stack">'+switcher+completion()+'</div><aside class="stack">'+homeRail()+'</aside></div>';
 if(!r||r.status==='source'){c=empty('Пока нечего согласовывать',r?'Источник недоступен, материал не подготовлен. Повторите запуск после проверки.':'Сначала создайте процесс и запустите его в учебном режиме.',action('auto','Перейти к процессам','primary'));}
 else{
  const blog=state.activeType==='blog',changed=r.status==='conflict',done=state.decision,v=r.version;
  const conflict=changed?'<div class="callout warn" role="alert"><strong>Версия материала изменилась.</strong> Проверьте новую версию до принятия решения.</div>':'';
  const labels={approved:'Утверждён, не опубликован',returned:'На доработке',cms:'Ошибка CMS',partial:'Отправлен, проверка результата не завершена',checking:'Проверяем результат',unknown:'Результат не подтверждён',confirmed:'Опубликован в учебном режиме'};
  const before=blog?'<h3>Тема и тезисы</h3><p>Как отличить актуальную информацию на сайте от устаревшей. Чек-лист проверки источников и дат.</p>':'<h3>Было · v'+v+'</h3><p>'+(v>3?'Доставка занимает до 4 рабочих дней.':'Доставка занимает до 7 рабочих дней.')+'</p>';
  const after=blog?'<h3>Черновик статьи</h3><p>Как проверить актуальность информации на сайте: сверяем факты с первоисточником, проверяем даты, согласовываем изменения и публикуем только подтверждённый материал.</p>':'<h3>Предлагается</h3><p>Доставка занимает до 5 рабочих дней.</p>';
  const compare='<div class="compare"><div>'+before+'</div><div>'+after+'</div></div>';
  const controls=changed?action('refresh-version','Обновить материал','primary'):!done?action('approve',blog?'Утвердить статью':'Утвердить обновление','primary')+action('return-review','Вернуть на доработку'):r.status==='approved'?action('publish',blog?'Смоделировать публикацию статьи':'Смоделировать обновление страницы','primary'):['cms','partial','unknown'].includes(r.status)?action('retry-cms','Проверить результат','primary'):r.status==='returned'?action('run','Повторить подготовку','primary'):r.status==='confirmed'?action('auto','Вернуться к процессу','primary')+action('chat','Открыть чат'):'';
  const title=blog?'Как проверить актуальность информации':'Срок доставки';
  c=panel('<div class="stack"><div class="card-head"><div><h2>'+title+'</h2><p class="url muted">https://sever.example'+esc(state.scenario?.page||'/blog')+'</p></div>'+badge(r.status==='confirmed'?'Опубликовано в демо':done==='yes'?'Утверждено':done==='no'?'На доработке':'На проверке',done==='no'?'warn':'')+'</div>'+rules([['Источник',esc(state.scenario?.source||'Учебные данные')],['Версия материала','v'+v],['Решение редактора',done==='yes'?'Утверждено':done==='no'?'На доработке':'Ожидается'],['Публикация',labels[r.status]||'Не отправлено']])+conflict+(['cms','partial','unknown'].includes(r.status)?'<div class="callout warn">Результат записи неизвестен — сначала проверяем CMS, не отправляем второй раз.</div>':'')+compare+(r.status==='confirmed'?'<div class="next-action"><strong>Результат подтверждён в демо</strong><p>Это учебная симуляция. Никакая статья или страница не опубликована.</p></div>':'')+(controls?'<div class="actions">'+controls+'</div>':'')+'</div>');
 }
 return heading('На проверке','Согласование материалов и подтверждение публикации')+'<div class="layout"><div class="stack">'+switcher+c+'</div><aside class="stack">'+homeRail()+samplePanel()+'</aside></div>';
}
function knowledge(){
 const blog=state.activeType==='blog';
 return heading('База знаний','Источники, подтверждённые факты и редакционные правила')+'<div class="layout"><div class="stack">'+panel('<div class="card-head"><div><small>Учебный источник</small><h2>'+(blog?'Вопросы клиентов и информация о продукте':'Условия доставки')+'</h2><p>'+(blog?'Материалы для подготовки тематического плана':'Доставка — до 5 рабочих дней')+'</p></div>'+badge(state.outcome==='source'?'Источник недоступен':'Демо',state.outcome==='source'?'warn':'')+'</div>'+rules([['Источник',blog?'База знаний и запросы аудитории':'Условия доставки · v4'],['Проверка','Учебные сведения'],['Связанный раздел',blog?'/blog':'/delivery']])+'<div class="actions">'+action('fact',state.factOpen?'Свернуть источник':'Что за источник?')+action('auto','К процессу')+'</div>'+(state.factOpen?'<p class="callout" style="margin-top:10px">Этот источник существует только в макете. Данные извне не загружаются.</p>':''))+panel('<h2>Правила бренда</h2><p class="muted">Редполитика, Tone of Voice и брендбук появятся здесь после настройки настоящего проекта. В демо загрузка отключена.</p>')+'</div><aside class="stack">'+homeRail()+'</aside></div>';
}
function integrations(){const systems=[['CMS','Чтение страницы и её версии','Запись утверждённого изменения'],['Wordstat','Чтение данных о запросах','Запись не требуется'],['Яндекс Метрика','Чтение показателей страниц','Запись не требуется'],['AI-провайдер','Чтение статуса доступа и лимитов','Подготовка текста по запросу']];return heading('Интеграции','Доступы для сценариев',state.integrationReturn?action('return-wizard','← Вернуться к сценарию','primary'):'')+'<div class="layout"><div class="stack">'+systems.map(([n,r,w])=>panel('<div class="card-head"><div class="row">'+glyph('integration')+'<h2>'+n+'</h2></div>'+badge('Не подключено','warn')+'</div>'+rules([['Чтение',r],['Запись',w]]))).join('')+'</div><aside class="stack">'+panel('<h2>Доступы в макете</h2><p class="muted">Внешние системы отключены. Все сценарии используют синтетические данные.</p>','rail')+'</aside></div>';}
function render(){
 persistSlot();
 const count=Object.values(state.slots).filter(x=>x.run?.status==='review').length;
 $('#nav').innerHTML=nav.map(([id,label,short])=>'<button type="button" data-action="'+id+'" aria-label="'+label+'" '+(state.section===id?'aria-current="page"':'')+'>'+svg(id)+'<span class="desktop-label">'+label+'</span><span class="mobile-label">'+short+'</span>'+(id==='review'&&count?'<span class="count" aria-hidden="true">'+count+'</span>':'')+'</button>').join('');
 $('#projectIcon').innerHTML=svg('project');$('#project').textContent='Учебный проект';$('#mode').textContent='UX-демо';$('#switch').textContent='Сбросить демо';$('#switch').dataset.action='reset';
 $('#main').classList.toggle('chat-mode',state.section==='chat');
 $('#view').innerHTML=({chat,auto:automation,review,knowledge,integration:integrations}[state.section])();
 if(state.section==='chat'){requestAnimationFrame(()=>{const f=$('#chat-scroll');if(!f)return;const w=document.querySelector('.wizard-message');if(w){f.scrollTop += w.getBoundingClientRect().top - f.getBoundingClientRect().top - 16;}else{f.scrollTop=f.scrollHeight;}});}
}
function enableDemo(){state.demo=true;}
function reset(demo){Object.assign(state,{demo:true,wizard:null,scenario:null,run:null,decision:null,history:[],paused:false,outcome:'normal',integrationReturn:false,factOpen:false,messages:[],chatDraft:'',activeType:'site',slots:{site:makeSlot(),blog:makeSlot()}});show('chat');}

function persistFields(e){const w=state.wizard;if(w&&e.target.form?.id==='wizard'&&e.target.name in w)w[e.target.name]=e.target.value;}
document.addEventListener('input',e=>{persistFields(e);if(e.target.id==='chat-prompt')state.chatDraft=e.target.value;});
document.addEventListener('keydown',e=>{if(e.target.id==='chat-prompt'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}});
document.addEventListener('change',e=>{persistFields(e);if(e.target.id==='outcome'){state.outcome=e.target.value;announce('Состояние примера изменено. Оно применяется при следующем действии.');}});
function checkStep(){const f=$('#wizard'),w=state.wizard;if(!f?.reportValidity())return false;if((w.step===0&&!w.title.trim())||(w.step===1&&(!w.page.trim()||!w.source.trim()))){const msg=$('#field-error');msg.hidden=false;msg.textContent='Заполните поля перед продолжением.';f.querySelector('input').focus();return false;}return true;}
document.addEventListener('submit',e=>{if(e.target.id==='chat-composer'){e.preventDefault();sendChat();return;}if(e.target.id==='wizard'){e.preventDefault();if(checkStep()&&state.wizard.step<4)goWizard(state.wizard.step+1);}});
function launch(){
 enableDemo();if(state.paused){show('auto');announce('Процесс на паузе. Сначала возобновите его.');return;}
 if(state.run)state.history.unshift(state.run);
 state.decision=null;
 const blog=state.activeType==='blog';
 state.run={time:new Intl.DateTimeFormat('ru-RU',{dateStyle:'short',timeStyle:'short'}).format(new Date()),status:state.outcome==='source'?'source':'review',version:3,log:['Начат учебный запуск '+(blog?'ведения блога':'актуализации сайта'),state.outcome==='source'?'Источник не ответил. Материал не создан.':blog?'Сформирован черновик статьи. Требуется решение редактора.':'Найдено устаревшее сведение. Предложена правка страницы.']};
 show(state.run.status==='review'?'review':'auto');
}
function publish(){
 const run=state.run;
 run.status=state.outcome==='cms'?'cms':state.outcome==='partial'?'partial':'checking';
 run.log.push(run.status==='cms'?'Учебная CMS не ответила на отправку.':'Правка отправлена в учебную CMS.');
 render();announce(runLabels[run.status]);
 if(run.status==='checking')reconcile(run);
}
function reconcile(run=state.run){
 if(!['checking','cms','partial','unknown'].includes(run.status))return;
 run.status='checking';
 const readAvailable=state.outcome!=='cms';
 run.log.push('Проверяем текущую версию страницы без повторной записи.');
 render();announce(runLabels.checking);
 setTimeout(()=>{
   if(state.run!==run)return;
   run.status=readAvailable?'confirmed':'unknown';
   run.log.push(readAvailable?'Чтение учебной страницы подтвердило правку.':'Учебная CMS недоступна. Результат записи остаётся неизвестным.');
   if(readAvailable){state.messages.push({role:'assistant',text:state.activeType==='blog'?'Готово: учебная статья опубликована. Полный текст доступен в итогах запуска.':'Готово: учебная страница обновлена. Сравнение до и после доступно в итогах запуска.'});show('review');}
   else {render();announce(runLabels[run.status]);}
 },650);
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
 const [id,arg]=b.dataset.action.split(':');
 const w=state.wizard;
 if(nav.some(([key])=>key===id)){show(id);return;}
 switch(id){
 case 'start':{
   if(!types[arg])break;
   selectSlot(arg);
   state.messages.push({role:'user',text:'Настроить: '+types[arg]});
   state.messages.push({role:'assistant',text:'Пройдём пять коротких шагов, затем покажем учебный результат и решение редактора.'});
   state.wizard=state.scenario?{...state.scenario,step:0,furthest:4}:draft(arg);
   show('chat');break;
 }
 case 'choose':selectSlot(arg);show('auto');break;
 case 'result':selectSlot(arg);show(state.run?.status==='confirmed'?'review':'auto');break;
 case 'open-result':show('review');break;
 case 'choose-review':selectSlot(arg);show('review');break;
 case 'new-chat':if(!state.wizard){state.messages=[];state.chatDraft='';show('chat');}break;
 case 'attach-source':show('knowledge');break;
 case 'back':if(w&&w.step>0)goWizard(w.step-1);break;
 case 'forward':if(w&&checkStep()&&w.step<w.furthest)goWizard(w.step+1);break;
 case 'type':if(w&&types[arg]){if(w.title===types[w.type])w.title=types[arg];w.type=arg;w.page=arg==='blog'?'/blog':'/delivery';w.source=arg==='blog'?'База знаний и запросы аудитории':'Условия доставки · v4';render();document.querySelector('[data-action="type:'+arg+'"]')?.focus();}break;
 case 'mode':if(w&&modes[arg]){w.mode=arg;render();document.querySelector('[data-action="mode:'+arg+'"]')?.focus();}break;
 case 'cancel':state.wizard=null;state.integrationReturn=false;show('chat');break;
 case 'check-integrations':state.integrationReturn=true;show('integration');break;
 case 'return-wizard':state.integrationReturn=false;show('chat');requestAnimationFrame(()=>$('#step-title')?.focus());break;
 case 'demo':case 'reset':reset(true);break;
 case 'demo-run':selectSlot('site');state.wizard=draft('site');show('chat');break;
 case 'save':case 'activate':
   if(!w||!checkStep())break;
   if(state.activeType!==w.type)selectSlot(w.type);
   if(state.run&&state.scenario?.title!==w.title){state.history.unshift(state.run);state.run=null;state.decision=null;}
   state.scenario={...w,active:id==='activate'};
   state.wizard=null;state.paused=false;state.integrationReturn=false;
   if(id==='activate'){enableDemo();launch();}
   else{show('auto');announce('Черновик сохранён в памяти демо. Чтобы увидеть результат, нажмите «Показать учебный результат».');}
   break;
 case 'edit':if(state.scenario){state.wizard={...state.scenario,step:0,furthest:4};show('chat');}break;
 case 'pause':state.paused=!state.paused;render();announce(state.paused?'Процесс поставлен на паузу.':'Процесс возобновлён.');break;
 case 'run':if(state.scenario)launch();else show('chat');break;
 case 'retry':state.outcome='normal';launch();break;
 case 'approve':if(!state.run)break;if(state.outcome==='conflict'&&state.run.version===3){state.run.status='conflict';state.run.log.push('Версия изменилась перед согласованием.');render();announce('Конфликт версии. Обновите сравнение.');}else{state.decision='yes';state.run.status='approved';state.run.log.push('Редактор утвердил материал.');render();announce('Материал утверждён. Следующий шаг — учебная публикация.');}break;
 case 'return-review':if(state.run){state.decision='no';state.run.status='returned';state.run.log.push('Редактор вернул материал на доработку.');render();announce('Вернули на доработку. Следующий шаг — повторная подготовка.');}break;
 case 'refresh-version':if(state.run){state.run.version++;state.run.status='review';render();announce('Версия обновлена. Проверьте заново.');}break;
 case 'publish':if(state.run)publish();break;
 case 'retry-cms':if(state.run)reconcile();break;
 case 'fact':state.factOpen=!state.factOpen;render();$('[data-action="fact"]')?.focus();break;
 }
});
render();
</script></body></html>

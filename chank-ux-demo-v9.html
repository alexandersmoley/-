/* Chat-first layout: retained five-section navigation, conversation is the primary workspace */
.content.chat-mode{max-width:none;margin:0;padding:0;height:calc(100dvh - 68px);min-height:420px;overflow:hidden;background:#fff}
.content.chat-mode #view{height:100%}
.content.chat-mode #feedback:not(:empty){position:absolute;z-index:5;left:50%;top:82px;transform:translateX(-50%);box-shadow:0 8px 28px #1d302626;max-width:min(480px,90vw)}
.chat-workspace{display:flex;flex-direction:column;height:100%;background:#fff;min-width:0}
.chat-topbar{height:57px;flex:none;border-bottom:1px solid #eff1ed;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 25px;color:var(--ink)}
.chat-topbar strong{font-size:15px;font-weight:700}
.chat-topbar .chat-sub{color:#7b857c;margin-left:9px;font-size:12px}
.chat-topbar .btn{background:transparent;border-color:#e5eae4}
.chat-topbar .btn:disabled{opacity:.4}
.chat-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:#dfe5df transparent}
.chat-thread{max-width:794px;margin:0 auto;padding:38px 22px 32px;display:flex;flex-direction:column;gap:26px;min-height:100%}
.chat-intro{text-align:center;margin:auto auto 28px;max-width:600px;padding:16px 0 0}
.chat-intro h1{font-size:clamp(27px,3vw,34px);font-weight:620;letter-spacing:-.047em;margin:0 0 10px}
.chat-intro p{font-size:14px;color:var(--muted)}
.chat-msg{width:100%;display:flex;min-width:0}
.chat-msg.user{justify-content:flex-end}
.chat-msg .chat-user-text{padding:12px 17px;border-radius:20px;background:#eef1eb;max-width:min(74%,520px);white-space:pre-wrap;line-height:1.58;overflow-wrap:anywhere}
.chat-msg.assistant{justify-content:flex-start}
.chat-msg .chat-answer{width:100%;max-width:750px;min-width:0}
.chat-answer .speaker{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:#566b5d;font-weight:700}
.chat-answer .speaker .ai-mark{width:21px;height:21px;display:grid;place-items:center;border:1px solid #c4d4c0;border-radius:7px;font-size:12px;background:#f1f5ee;color:#2f5135}
.chat-answer p{font-size:15px;line-height:1.65;white-space:pre-wrap}
.chat-choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}
.chat-choices button{border:1px solid #dce4d9;background:#fff;border-radius:15px;padding:10px 14px;text-align:left;min-height:42px;font-weight:580;color:#294634;transition:background .15s}
.chat-choices button:hover{background:#eff5ec}
.chat-empty-start{display:flex;flex-direction:column;gap:26px;margin:auto 0}
.chat-empty-start .chat-choices{justify-content:center}
.chat-empty-start .chat-choices button{background:#f9fbf7}
.wizard-message{display:flex;gap:0;min-width:0}
.wizard-message .chat-answer{width:100%;min-width:0}
.wizard-card{margin-top:8px;border:1px solid #dfe5dc;background:#fafbf8;border-radius:18px;padding:20px;max-width:700px}
.wizard-card h2{font-size:21px}
.wizard-card .form{gap:14px}
.wizard-card .form .btn{min-height:42px}
.wizard-controls{border-top:1px solid #e6eae3;display:flex;justify-content:space-between;padding-top:11px;margin-top:16px}
.wizard-controls .btn{min-width:90px}
.chat-composer-zone{flex:none;width:100%;padding:10px 22px 19px;background:#fff}
.chat-composer-inner{max-width:794px;margin:0 auto}
.chat-composer{border:1px solid #d9e1d7;border-radius:24px;box-shadow:0 3px 16px #23372c0a;background:#f8f9f6;padding:9px 9px 9px 15px;display:flex;align-items:flex-end;gap:9px}
.chat-composer:focus-within{border-color:#9aaf98;box-shadow:0 0 0 2px #ceddc84d}
.chat-composer textarea{resize:none;width:100%;min-height:47px;max-height:160px;background:transparent;border:0;outline:0;padding:13px 4px 10px;color:var(--ink);font-size:15px;line-height:1.48;box-shadow:none}
.chat-composer textarea:focus{outline:0}
.chat-composer button{flex:none;border:0;display:grid;place-items:center;cursor:pointer}
.chat-composer .attach{height:36px;width:36px;border:1px solid #e1e7de;background:white;border-radius:50%;font-size:22px;line-height:1;color:#385141;margin-bottom:5px}
.chat-composer .send{height:39px;width:39px;border-radius:50%;background:var(--pine);color:#fff;font-size:20px;line-height:1;margin-bottom:4px}
.chat-composer .send:hover{background:#345943}
.chat-footnote{text-align:center;color:#859188;font-size:11px;margin-top:8px}
@media(max-width:630px){
 .content.chat-mode{height:calc(100dvh - 52px - 52px - 63px - env(safe-area-inset-bottom));min-height:200px;padding:0}
 .chat-topbar{height:49px;padding:0 12px}
 .chat-topbar .chat-sub{display:none}
 .chat-topbar .btn{font-size:11px;padding:6px 10px;min-height:33px}
 .chat-thread{padding:22px 15px 16px;gap:21px}
 .chat-intro{margin:auto auto 20px;padding-top:10px}
 .chat-intro h1{font-size:27px}
 .chat-choices{gap:7px}
 .chat-choices button{font-size:12px;min-height:39px;padding:8px 11px}
 .chat-msg .chat-user-text{max-width:86%;padding:11px 14px}
 .chat-answer p{font-size:14px}
 .wizard-card{padding:14px;border-radius:13px}
 .wizard-card h2{font-size:19px}
 .wizard-controls .btn{font-size:12px}
 .chat-composer-zone{padding:7px 10px 7px}
 .chat-composer{border-radius:20px;padding:7px 8px 6px 9px;gap:5px}
 .chat-composer textarea{font-size:16px;padding:12px 2px 7px;min-height:47px}
 .chat-composer .attach{height:33px;width:33px;margin-bottom:5px}
 .chat-composer .send{height:36px;width:36px;margin-bottom:3px}
 .chat-footnote{font-size:10px;margin-top:4px}
}
@media(max-width:630px){
 .label input,.label select,.label textarea,select.field{font-size:16px}
 .identity{padding-top:max(11px,env(safe-area-inset-top))}
 .chat-composer .attach,.chat-composer .send{min-width:44px;min-height:44px}
 .content.chat-mode{height:calc(100vh - 167px);height:calc(100dvh - 167px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
}

/* UX iteration: two business processes, one next action at a time */
.entry-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;margin:22px auto 0}
.entry-grid button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:165px;border:1px solid #d9e3d8;background:#fbfcf9;border-radius:18px;padding:19px;text-align:left;color:#202c25}
.entry-grid button:hover,.entry-grid button:focus-visible{border-color:#59826a;background:#f0f6ed}
.entry-grid .entry-icon{width:36px;height:36px;border-radius:11px;background:#e3eddf;display:grid;place-items:center;color:#284b35}
.entry-grid .entry-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.entry-grid strong{font-size:18px;line-height:1.25;letter-spacing:-.035em}
.entry-grid small{font-size:13px;color:#58665b;line-height:1.5}
.entry-grid .entry-tail{font-size:12px;font-weight:700;color:#335f41;margin-top:auto}
.entry-help{font-size:12px;color:#7c877d;text-align:center;margin:12px 0 0}
.workflow-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:17px}
.workflow-list button{border:1px solid #dbe2d8;background:#f8faf5;border-radius:12px;text-align:left;padding:12px;min-height:64px;color:inherit}
.workflow-list button[aria-pressed=true]{border-color:#518165;background:#e8f2e5}
.workflow-list button strong{display:block;font-size:14px}
.workflow-list button small{font-size:11px}
.next-action{padding:16px 18px;border:1px solid #cbdcca;background:#f1f6ee;border-radius:13px}
.next-action strong{display:block;margin-bottom:6px;font-size:15px}
.next-action p{font-size:13px;line-height:1.5;color:#496150}
.process-switcher{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.process-switcher button{display:block;text-align:left;padding:13px;background:#f8faf7;color:#263b2d;border:1px solid #dbe2d8;border-radius:12px;min-height:61px}
.process-switcher button[aria-pressed=true]{border-color:#476e50;background:#e8f2e5}
.process-switcher button strong{display:block}.process-switcher button small{display:block}

/* Completion appears within a run, not in a new navigation section */
.finish{display:grid;gap:17px;max-width:940px}
.finish-head{padding:25px;background:#edf5eb;border:1px solid #c9ddc7;border-radius:17px}
.finish-kicker{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:750;color:#386647}
.finish-head h2{font-size:clamp(23px,4vw,31px);line-height:1.18;letter-spacing:-.045em;margin:8px 0}
.finish-head p{font-size:14px;color:#496050;max-width:660px}
.finish-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.finish-summary div{border:1px solid #e0e5dc;border-radius:11px;padding:12px;background:#fff;min-width:0}
.finish-summary dt{font-size:11px;color:#778377;margin-bottom:5px}
.finish-summary dd{margin:0;font-weight:650;overflow-wrap:anywhere;font-size:13px}
.result-document{border:1px solid #dce5d9;border-radius:16px;background:white;padding:22px}
.result-document header{margin-bottom:18px;padding-bottom:15px;border-bottom:1px solid #e3e9e0}
.result-document header small{display:block;margin:0 0 8px}
.result-document h2{font-size:clamp(20px,3vw,27px);margin-bottom:7px}
.result-document h3{font-size:16px;margin:18px 0 6px}
.result-document p{line-height:1.7;margin:0 0 11px;max-width:70ch}
.result-document .result-url{overflow-wrap:anywhere;font-size:12px;color:#637769}
.finish-actions{display:flex;flex-wrap:wrap;gap:8px}

@media(max-width:630px){.finish-head{padding:18px}.finish-summary{grid-template-columns:1fr}.result-document{padding:16px}.finish-actions .btn{flex:1 1 auto}}


.client-result-link{padding:15px 18px;border:1px solid #d2dfd1;border-radius:13px;background:#f9fbf8;display:grid;gap:7px}
.client-result-link strong{font-size:14px}.client-result-link small{font-size:12px;color:#586b5a}
.client-result-link .result-address{font-size:12px;overflow-wrap:anywhere;color:#496656}
.client-result-link .btn{width:max-content;max-width:100%;margin-top:5px;text-decoration:none;display:inline-flex;align-items:center}
.client-site-page{max-width:900px;margin:0 auto;background:#fff;border:1px solid #e3e8e1;border-radius:16px;overflow:hidden}
.client-site-head{padding:16px 24px;border-bottom:1px solid #e6e9e6;display:flex;justify-content:space-between;align-items:center}
.client-site-head strong{font-size:21px}
.client-site-body{padding:28px 24px 38px}.client-site-body h2{font-size:clamp(24px,4vw,38px);letter-spacing:-.045em;margin-bottom:20px}

/* The composer is the primary control; stage review stays in the dialogue. */

.composer-tool-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* Contextual actions and lightweight hints stay next to the composer. */

      s.fault='normal';log(s,'Учебное подключение '+kind+' восстановлено. Реальные сервисы не подключались.',now);break;
    }
    case 'fixture':
      if(!['normal','source','cms','unknown','conflict','expire','revoke'].includes(d.fault))fail('Неизвестный учебный случай.');
      if(d.fault==='conflict'){s.source.revision++;s.source.days=s.source.days===3?2:3;log(s,'Учебный источник изменился; старое решение больше не актуально.',now);}
      else if(d.fault==='expire'){if(p)p.expires=now-1;}
      else if(d.fault==='revoke'){if(s.scenario)s.scenario.selfReview=false;}
      else s.fault=d.fault;break;
    default:fail('Неизвестная команда.');
  }
  s.revision++;s.receipts[c.key]=signature;return s;
}
function tick(original,now=Date.now()) {
  if(!original.scenario||original.scenario.status!=='Активен'||!original.scenario.due||original.scenario.due>now)return original;
  const s=structuredClone(original);run(s,now);s.scenario.due=null;s.revision++;return s;
}

function localDateTime(iso,zone){
  if(!iso||!Number.isFinite(Date.parse(iso)))return '';
  const d=new Date(iso);
  const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:zone??'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(d).map(x=>[x.type,x.value]));
  return parts.year+'-'+parts.month+'-'+parts.day+'T'+parts.hour+':'+parts.minute+':'+parts.second;
}

function chatTools(){

function destinationFor(text){
  if(/результат|публикац|открой страницу/i.test(text)&&delivery())return 'chat/result';
  if(/провер.*правк|исправ.*предложен|доработ/i.test(text)&&latest())return 'chat/review';
  if(/подключ|интеграц/i.test(text))return 'chat/connections';
  if(/источник|база знаний/i.test(text))return 'chat/sources';
  return null;
}
async function dispatchPrompt(text){
  const input=String(text??'').trim();
  if(!input)return false;
  if(state.draft&&$('#wizard')&&!(await saveDraft(Number(route().part)||0)))return false;
  if(!(await send('message',{text:input})))return false;
  if(/^(запусти|запустить|выполни) проверку[!. ]*$/i.test(input)&&state.scenario&&!state.draft&&state.scenario.status==='Активен'){
    if(await send('run')){if(latest()?.runId===state.runs.at(-1)?.id&&state.runs.at(-1)?.status==='На проверке')go('chat/review');else go('chat');}
    return true;
  }
  go(state.draft?'chat/'+state.draft.step:destinationFor(input)??'chat');
  return true;
}

  const current=['review','result','connections','sources','page','reset'].includes(route().part)?inlineStage():state.draft&&route().part!=='home'?draftForm():state.messages.length||state.scenario||state.draft?flowInChat():'';
  const empty=!state.messages.length&&!state.scenario&&!state.draft;
  const hints=state.draft?['Что дальше?']:latest()?.state==='На доработке'?['Исправить предложение','Что дальше?']:delivery()?.status==='Подтверждено'?['Покажи результат','Что дальше?']:latest()?.state==='На проверке'?['Проверь правку','Что дальше?']:['Что дальше?','Покажи статус'];
  return `<div class="chat-workspace"><div class="chat-topbar"><strong>Чанк · рабочий диалог</strong><span class="proto-note">Учебный диалог · без AI</span></div><div class="chat-scroll" id="chat-scroll"><div class="chat-thread">${empty?welcome:state.messages.map(m=>message(m.role,m.text)).join('')}${current}</div></div><div class="chat-composer-zone"><div class="chat-composer-inner"><div class="composer-tools" id="composer-tools" hidden><strong>Что сделать?</strong><div class="composer-tool-buttons">${chatTools()}</div></div><form id="composer" class="chat-composer-inner"><div class="chat-hints">${hints.map(t=>`<button type="button" data-prompt="${esc(t)}">${esc(t)}</button>`).join('')}</div><div class="chat-composer"><button type="button" class="attach" data-action="menu" aria-label="Открыть меню действий" aria-expanded="false" aria-controls="composer-tools">+</button><textarea aria-label="Сообщение Чанку" placeholder="Например: что дальше?" rows="1"></textarea><button class="send" aria-label="Отправить сообщение">↑</button></div><div class="chat-footnote">${portable?'Автономный макет: расписание без браузера не выполняется.':'Учебный локальный сервер · состояние сохраняется после закрытия браузера.'}</div></form></div></div></div>`;
}
function automations(){
  const s=state.scenario;if(!s)return heading('Автоматизации','Постоянные процессы проекта')+card('<h2>Актуализация пока не настроена</h2>'+link('chat','Настроить в чате'));
  return heading('Автоматизации','Актуализация сайта · история отдельных запусков')+`<div class="stack">`+card(`<div class="card-head"><h2>${esc(s.title)}</h2>${badge(s.status,s.status==='Активен'?'':'warn')}</div><dl class="rules"><div><dt>Когда</dt><dd>${when(s)}</dd></div><div><dt>Следующий запуск</dt><dd>${s.status==='Приостановлен'?'Расписание на паузе':s.mode==='recurring'?'Регулярность только показана в макете':time(s.due)}</dd></div><div><dt>Источник / страница</dt><dd>Условия доставки → /delivery</dd></div><div><dt>Кто проверяет</dt><dd>Владелец, явная проверка фактов</dd></div></dl><div class="actions">${btn('run','Запустить проверку',true,s.status!=='Активен')}${btn(s.status==='Активен'?'pause':'resume',s.status==='Активен'?'Приостановить':'Возобновить')}${btn('edit','Изменить через чат')}</div>`)+card(`<h2>Запуски</h2>${state.runs.length?state.runs.slice().reverse().map(r=>`<article class="banner"><div class="statusline">${badge(runViewStatus(r),r.status==='Ошибка источника'?'error':'')}<small>${esc(r.id)} · ${time(r.at)} · сценарий v${r.scenarioVersion}</small></div>${r.status==='Ошибка источника'?'<p>Источник недоступен. Сохранённый материал и предложения не изменены. Проверьте источник и запустите проверку снова.</p>':''}${state.proposals.some(p=>p.runId===r.id)?r.id===latest()?.runId?link('review','Открыть это предложение'):link('review','Посмотреть предыдущие версии'):''}</article>`).join(''):'<p>Запусков ещё нет. Сохранение сценария не выполняет команды.</p>'}`)+card(`<h2>Журнал</h2><ol class="timeline">${state.events.slice(0,15).map(e=>`<li>${esc(e.text)}<br><small>${time(e.at)} · ${esc(e.actor)}</small></li>`).join('')}</ol>`)+fixtures()+`</div>`;
}
function runViewStatus(r){const p=state.proposals.find(p=>p.runId===r.id);if(!p)return r.status;const x=state.deliveries.find(x=>x.proposalId===p.id);return x?.status??p.state;}
function result(){const p=latest(),x=delivery();return heading('Результат запуска','Актуализация сайта · /delivery')+`<div class="stack">${p&&x?deliveryCard(p,x,false):card('<p>Запись ещё не запрошена.</p>'+link('chat','Продолжить процесс в чате'))}${card(link('review','Показать согласованную правку и доказательства'))}${fixtures()}</div>`;}
function stale(p){return p.sourceRevision!==state.source.revision||p.targetRevision!==state.cms.revision||p.scenarioVersion!==state.scenario.version||Date.now()>p.expires;}
function review(){
  const p=latest();if(!p)return heading('На проверке','Предложения и решения проекта')+card('<h2>Пока нет предложений</h2><p>После проверки источника здесь появится конкретная правка.</p>'+link('chat',state.scenario?'Продолжить проверку в чате':'Настроить актуализацию в чате'));
  const x=delivery(),old=stale(p)&&!x;
  return heading('На проверке','Условия доставки · одно предложение для одной страницы')+`<div class="stack">`+card(`<div class="statusline">${badge(old?'Версия устарела':p.state,old?'error':'')}<small>${esc(p.id)} · ${esc(p.runId)}</small></div><h2>Сократить срок доставки с ${p.before} до ${p.after} дней</h2><p class="source-url">Страница: https://masterskaya.example/delivery</p><p>Изменение обнаружено в разрешённом источнике. Сведения пока считаются утверждением источника, а не доказанным фактом.</p><div class="review-grid"><article><small>Было · страница v${p.targetRevision}</small><p>Доставка занимает <del>${p.before} рабочих дней</del>.</p></article><article><small>Предлагается · материал ${esc(p.id)}</small><p><ins>${esc(p.copy??`Доставка занимает ${p.after} рабочих дня.`)}</ins></p></article></div><div class="actions">${btn('evidence',p.evidenceViewed?'Открыть доказательства ещё раз':'Открыть источник и доказательства',true)}</div>${p.evidenceViewed?`<section class="evidence"><h3>Источник: «Условия доставки» · v${p.sourceRevision}</h3><p>Снимок сохранён ${time(p.created)}. Учебный документ, источник не запрашивается по сети.</p><blockquote>«Доставка занимает ${p.after} рабочих дня».</blockquote><p>Факт «Срок доставки» → ${p.after} дня. Цитата совпадает с сохранённым текстом; достоверность требует вашей проверки.</p><p>Сценарий v${p.scenarioVersion} · страница v${p.targetRevision} · источник v${p.sourceRevision}. Срок актуальности: ${time(p.expires)}.</p></section>`:''}${old?`<div class="notice"><strong>Нельзя согласовать старую версию</strong><p>Источник, страница, сценарий или срок актуальности изменились. Старый снимок и история сохранены. Выполните новую проверку и рассмотрите новое предложение.</p>${btn('run','Получить новое предложение',true,state.scenario.status!=='Активен')}</div>`:''}${p.state==='На проверке'&&!old?`<form id="decision"><div class="notice"><strong>Проверьте правку перед записью</strong><p>Решение касается только этой версии. Утверждение ещё не меняет страницу сайта.</p></div><label class="check"><input name="evidenceConfirmed" type="checkbox" ${!p.evidenceViewed?'disabled':''}>Я открыл доказательства и проверил факт по источнику</label><label class="check"><input name="versionsConfirmed" type="checkbox">Я проверил страницу, текст изменения и версии</label><label class="label">Основание решения<textarea name="reason" rows="2" required minlength="5" placeholder="Что проверено и почему правка допустима"></textarea></label><div class="actions"><button class="btn primary" ${!p.evidenceViewed?'disabled':''}>Согласовать эту версию</button>${btn('return','Вернуть на доработку')}</div></form>`:''}${p.decision?`<p class="context">Решение: ${esc(p.decision.actor)} · ${time(p.decision.at)}<br>Основание: ${esc(p.decision.reason)}</p>`:''}${p.state==='На доработке'&&!old?`<div class="notice"><strong>Вернуть к согласованию</strong><p>Причина: ${esc(p.returnReason)}. Исправьте формулировку, сохранив подтверждённый срок доставки. Чанк создаст новую версию, которую потребуется проверить заново.</p></div><form id="revise" class="form"><label>Исправленный текст<textarea name="copy" rows="3" required minlength="15" maxlength="500">${esc(p.copy??`Доставка занимает ${p.after} рабочих дня.`)}</textarea></label><label>Что изменено?<textarea name="reason" required minlength="5" maxlength="500" rows="2" placeholder="Например: уточнил, от какого дня считать срок"></textarea></label><button class="btn primary">Подготовить новую версию</button></form>`:''}`)+
  (p.state==='Согласовано'?deliveryCard(p,x,old):'')+card(`<h2>История предложений</h2><p class="context">Можно раскрыть любую версию. Просмотр истории не запускает проверку и не повторяет запись.</p><div class="proposal-history">${state.proposals.slice().reverse().map(v=>{const x=state.deliveries.find(item=>item.proposalId===v.id);return `<details class="proposal-history-item"><summary><strong>${esc(v.id)}</strong> · ${esc(v.state)} · источник v${v.sourceRevision}${x?' · CMS: '+esc(x.status):''}</summary><dl class="rules"><div><dt>Запуск</dt><dd>${esc(v.runId)}</dd></div><div><dt>До</dt><dd>Доставка занимает ${esc(v.before)} рабочих дней.</dd></div><div><dt>Редакция</dt><dd>${esc(v.copy??`Доставка занимает ${v.after} рабочих дня.`)}</dd></div><div><dt>Источник</dt><dd>Версия ${esc(v.sourceRevision)} · создано ${time(v.created)}</dd></div><div><dt>Решение</dt><dd>${v.decision?esc(v.decision.reason):v.returnReason?esc(v.returnReason):'Не согласовано'}</dd></div><div><dt>Запись</dt><dd>${x?.proof?'Подтверждена чтением CMS · страница v'+x.proof.revision:x?esc(x.status):'Не запрашивалась'}</dd></div></dl></details>`}).join('')}</div><div class="actions">${link('auto','К запускам и журналу')}${link('chat','Вернуться в чат')}</div>`)+fixtures()+`</div>`;
}
function deliveryCard(p,x,old){
  if(!x)return card(`<h2>Следующий шаг: запись в учебную CMS</h2><p>Правка утверждена, но страница ещё не изменена. Перед записью проверим доступ и убедимся, что страница не успела измениться.</p><p>Изменится только /delivery в изолированном учебном хранилище.</p>${btn('deliver','Записать согласованную версию в тестовую CMS',true,old)}`);
  if(x.status==='Подтверждено')return card(`<div class="proof"><small>Результат запуска</small><h2>Изменение записано и подтверждено</h2><p>Чанк повторно прочитал учебную страницу и сверил текст и версию записи.</p></div><article class="result-document"><h2>Доставка</h2><p>${esc(p.copy??`Доставка занимает ${p.after} рабочих дня.`)}</p><small>Учебная страница /delivery · версия ${x.proof.revision}</small></article><p class="mono">Ключ записи: ${esc(x.key)}</p><p class="context">Подтверждено ${time(x.proof.at)}. Это результат учебной записи, реальный сайт не изменён.</p><div class="actions">${link('chat/page','Открыть учебную страницу')}${link('auto','К истории запуска')}${link('chat','Продолжить в чате')}</div>`);
  return card(`<h2>${esc(x.status)}</h2>${x.status==='Результат не подтверждён'?`<p>Ответ CMS потерян. Запись могла состояться. Не отправляйте её повторно: сначала прочитаем страницу и сверим квитанцию.</p>${btn('reconcile','Проверить результат через read-back',true)}`:x.status==='Ошибка CMS'?`<p>CMS недоступна, запись не выполнена. Версия и решение сохранены. После восстановления доступа проверим неизменность страницы и повторим с тем же ключом.</p>${btn('retry','Проверить и повторить запись',true)}`:'<p>Прочитанная страница не совпала с ожидаемой. Нужен разбор конфликта; повторная запись запрещена.</p>'}<div class="actions">${link('integration','Проверить подключение')}${link('auto','Открыть журнал')}</div>`);
}
function fixtures(){if(new URLSearchParams(location.search).get('debug')!=='1')return '';return `<details data-debug-fixtures="true"><summary>Проверка макета · учебные нештатные ситуации</summary><p class="context">Меняется только синтетический проект. Внешние запросы отсутствуют.</p><div class="actions">${[['normal','Без ошибок'],['source','Ошибка источника'],['cms','Ошибка CMS'],['unknown','Ответ потерян после записи'],['conflict','Новая версия источника'],['expire','Истёк срок доказательств'],['revoke','Отозвать самопроверку']].map(([k,v])=>btn('fixture:'+k,v)).join('')}</div><small>Текущий режим: ${esc(state.fault)}. Изменение источника/отзыв права — отдельные учебные события.</small></details>`;}
function render(){
  const {section,part}=route();
  $('#nav').innerHTML=nav.map(([key,label,mobile,icon])=>`<button data-nav="${key}" aria-label="${label}" ${section===key?'aria-current="page"':''}><span aria-hidden="true">${icon}</span><span class="desktop-label">${label}</span><span class="mobile-label">${mobile}</span></button>`).join('');
  $('#main').classList.toggle('chat-mode',section==='chat');
  $('#view').innerHTML=section==='chat'?chat():section==='auto'?automations():section==='review'?part==='result'?result():part==='page'?heading('Учебная страница','Внутренняя имитация сайта клиента')+card(`<h2>Доставка</h2><p>${esc(state.cms.copy??`Доставка занимает ${state.cms.days} рабочих дня.`)}</p><p>Текущая версия: ${state.cms.revision}</p>${link('review','К подтверждению записи')}`):review():section==='knowledge'?heading('База знаний','Сохранённые источники проекта')+card(`<h2>Условия доставки</h2><p>Учебный источник v${state.source.revision}: доставка ${state.source.days} рабочих дня. Все сведения вымышлены.</p><p>Снимок, цитата и решение связаны версиями. Изменение источников и загрузка документов пока не входят в автономный макет.</p>${link('chat','Продолжить работу в чате')}${latest()?.state==='На проверке'?link('chat/review','Проверить сохранённую правку'):''}`):heading('Интеграции','Только изолированный учебный контур')+card(`<h2>Тестовая CMS</h2>${badge('Локальная имитация')}<p>Чтение /delivery и условная запись согласованной версии. Доступа к реальным сайтам нет.</p><h2>Источник</h2><p>Локальный документ с фиксированным адресом /delivery. Произвольные URL не поддерживаются.</p><h2>AI и внешние сервисы</h2><p>Не подключены. Настройка реального подключения в этом демо недоступна.</p>${state.fault==='source'||state.fault==='cms'?btn('repair','Восстановить учебное подключение',true):''}${link(state.draft?'chat/'+state.draft.step:'chat',state.draft?'Продолжить настройку':'Продолжить процесс в чате')}`);
  if(portable)$('#demo-label').textContent='Автономный UX-макет · без сервера';
  if(section==='chat')requestAnimationFrame(()=>{const area=$('#chat-scroll'),inline=$('.chat-inline-stage');if(inline)inline.scrollIntoView({block:'start'});else if(area)area.scrollTop=area.scrollHeight;});
}
function fields(){
  const f=$('#wizard');if(!f)return {};
  const d=Object.fromEntries(new FormData(f));
  if(f.querySelector('[name=selfReview]'))d.selfReview=f.elements.selfReview.checked;
  if(f.elements.atLocal){
    const zone=d.zone??state.draft?.zone??'Europe/Moscow';
    const offset={'Europe/Moscow':'+03:00','Asia/Yekaterinburg':'+05:00','UTC':'+00:00'}[zone];
    if(!offset)throw Error('Для этого часового пояса нужен точный пересчёт времени.');
    d.at=d.atLocal?d.atLocal+offset:'';
    delete d.atLocal;
  }
  return d;
}
async function saveDraft(step){return send('draft',{...fields(),step});}
document.addEventListener('click',async e=>{
  const n=e.target.closest('[data-nav]');if(n){if(state.draft&&$('#wizard')&&!(await saveDraft(Number(route().part)||0)))return;go(n.dataset.nav);return;}
  const a=e.target.closest('[data-action]')?.dataset.action;if(!a||busy)return;
  if(a==='menu'){const m=$('#composer-tools');if(m){m.hidden=!m.hidden;const b=$('.attach');if(b)b.setAttribute('aria-expanded',String(!m.hidden));}return;}
  if(a==='knowledge'){if(state.draft&&$('#wizard')&&!(await saveDraft(Number(route().part)||0)))return;go('chat/sources');return;}
  if(a==='integration'){if(state.draft&&$('#wizard')&&!(await saveDraft(Number(route().part)||0)))return;go('chat/connections');return;}
  if(a==='blog'){if(await send('message',{text:'Вести блог'}))go('chat');return;}
  if(a==='continue-edit'||a==='resume-wizard'){go('chat/'+(state.draft?.step??0));return;}if(a==='close-wizard'){if(await saveDraft(Number(route().part)||0))go('chat/home');return;}if(a==='discard-draft'){if(await send('discard-draft'))go('chat');return;}
  if(a==='open-review'){go('chat/review');return;}if(a==='open-result'){go('chat/result');return;}
  if(a==='open-reset'){go('chat/reset');return;}
  if(a==='reset-demo'){if(await send('reset-demo')){go('chat');notify('Учебный проект очищен. Можно начать заново.');}return;}
  if(a==='start'){if(state.scenario){if(await send('edit'))go('chat/0');}else if(await send('message',{text:'Актуализировать сайт'}))go('chat/0');return;}
  if(a==='next'||a==='previous'){const step=Number(route().part)||0;if(a==='next'&&!$('#wizard').reportValidity())return;if(await saveDraft(step+(a==='next'?1:-1)))go(`chat/${step+(a==='next'?1:-1)}`);return;}
  if(a==='save'){if(await saveDraft(3)&&await send('save'))go('chat');return;}
  if(a==='edit'){if(await send('edit'))go('chat/0');return;}
  if(a==='evidence'){if(await send('evidence')){render();$('.evidence')?.scrollIntoView({block:'center'});}return;}
  if(a==='return'){const f=$('#decision');if(!f?.reportValidity())return;if(await send('return',{reason:f.elements.reason.value})){if(route().section==='chat')go('chat/review');else render();}return;}
  if(a.startsWith('fixture:')){await send('fixture',{fault:a.split(':')[1]});render();return;}
  if(['run','pause','resume','deliver','reconcile','retry','repair'].includes(a)){const inChat=route().section==='chat';if(await send(a)){if(inChat){if(a==='run'&&latest()?.runId===state.runs.at(-1)?.id&&state.runs.at(-1)?.status==='На проверке')go('chat/review');else if(a==='repair')go('chat');else go('chat');}else if(a==='run'&&latest()?.runId===state.runs.at(-1)?.id)go('review');else if(['deliver','reconcile','retry'].includes(a))go('review/result');else render();}return;}
});
document.addEventListener('click',async e=>{
 const prompt=e.target.closest('[data-prompt]')?.dataset.prompt;
 if(!prompt||busy)return;
 await dispatchPrompt(prompt);
});
document.addEventListener('click',async e=>{const a=e.target.closest('a[href^="#"]');if(a&&$('#wizard')){e.preventDefault();if(await saveDraft(Number(route().part)||0))go(a.hash.slice(1));}});
document.addEventListener('change',e=>{if(e.target.name==='mode'){const d={...state.draft,...fields()};$('#timing').innerHTML=timingFields(d);}});
document.addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;
  if(e.target.id==='composer'){const t=e.target.querySelector('textarea');if(await dispatchPrompt(t.value))t.value='';}
  if(e.target.id==='decision'){const f=e.target;if(await send('approve',{evidenceConfirmed:f.elements.evidenceConfirmed.checked,versionsConfirmed:f.elements.versionsConfirmed.checked,reason:f.elements.reason.value})){if(route().section==='chat')go('chat');else render();}}
  if(e.target.id==='revise'){const f=e.target;if(!f.reportValidity())return;if(await send('revise',{copy:f.elements.copy.value,reason:f.elements.reason.value})){if(route().section==='chat')go('chat/review');else render();}}
});
window.addEventListener('hashchange',()=>{notify('');render();window.scrollTo(0,0);});
if(!location.hash)history.replaceState(null,'','#chat');
render();
setInterval(async()=>{if(busy||document.activeElement?.matches('input,textarea,select'))return;try{const s=portable?tick(state):await fetch('/api/state').then(r=>r.json());if(s.revision!==state.revision){state=s;if(portable)localStorage.setItem(storageKey,JSON.stringify(state));render();}}catch{/* retain last known state; a new command displays the error */}},1000);
</script></body></html>

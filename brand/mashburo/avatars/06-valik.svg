<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Машбюро: лист в валике, оттиск со смещением">
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feComposite in="a" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#F2ECE1"/>
  <g transform="rotate(-5 256 250)">
    <path d="M166 104 H 300 L 346 150 V 350 H 166 Z" fill="none" stroke="#C8402E" stroke-width="16" transform="translate(12 -12)"/>
    <path d="M166 104 H 300 L 346 150 V 350 H 166 Z" fill="#F2ECE1" stroke="#14110F" stroke-width="16"/>
    <path d="M300 104 L 346 150 H 300 Z" fill="#14110F"/>
    <g fill="#14110F">
      <rect x="196" y="196" width="120" height="15" rx="7"/>
      <rect x="196" y="232" width="120" height="15" rx="7"/>
      <rect x="196" y="268" width="74" height="15" rx="7"/>
    </g>
  </g>
  <rect x="66" y="330" width="380" height="88" rx="44" fill="#14110F"/>
  <rect x="24" y="356" width="52" height="36" rx="18" fill="#14110F"/>
  <rect x="436" y="356" width="52" height="36" rx="18" fill="#14110F"/>
  <rect width="512" height="512" fill="#14110F" filter="url(#grain)" opacity="0.5"/>
</svg>

  <path d="M0 1080 L1920 1080 L1920 940 Q960 1010 0 900 Z" fill="#C8102E"/>

  <!-- урна -->
  <rect x="700" y="580" width="520" height="360" rx="24" fill="#4A5A68"/>
  <rect x="700" y="580" width="520" height="70" rx="24" fill="#3A4854"/>
  <rect x="660" y="520" width="600" height="72" rx="18" fill="#C8102E"/>
  <rect x="840" y="546" width="240" height="20" rx="10" fill="#8E1220"/>
  <rect x="760" y="700" width="400" height="180" rx="14" fill="#5A6B7A"/>
  <rect x="800" y="740" width="320" height="16" rx="8" fill="#7A8A98"/>
  <rect x="800" y="784" width="240" height="16" rx="8" fill="#7A8A98"/>

  <!-- бюллетень -->
  <g transform="rotate(-9 960 330)">
    <rect x="800" y="170" width="320" height="330" rx="12" fill="#FFFFFF"/>
    <rect x="840" y="215" width="240" height="18" rx="9" fill="#C9CFD4"/>

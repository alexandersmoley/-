    <path d="M852 384 l24 26 l44 -60" fill="none" stroke="#C8102E" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="944" y="366" width="136" height="16" rx="8" fill="#D8DDE1"/>
  </g>


  <!-- лучи -->
  <g stroke="#C8102E" stroke-width="14" stroke-linecap="round" opacity="0.9">
    <path d="M520 300 l70 46"/><path d="M470 470 l84 6"/><path d="M540 640 l74 -40"/>

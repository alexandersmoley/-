name: Render approved Instagram posts

on:
  workflow_dispatch:
  push:
    paths:
      - "instagram-factory/assets/**"
      - "instagram-factory/content/**"
      - "instagram-factory/posts/**"
      - "instagram-factory/renderer/**"
      - "instagram-factory/schemas/**"
      - "instagram-factory/scripts/**"
      - "instagram-factory/package.json"
      - "instagram-factory/pnpm-lock.yaml"
      - "instagram-factory/pnpm-workspace.yaml"
      - ".github/workflows/render-instagram.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  render:
    outputs:
      pages-enabled: ${{ steps.pages-configure.outcome == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instagram-factory
    env:
      OUTPUT_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: instagram-factory/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Render, QA and build Pages bundle
        run: pnpm run pipeline

      - name: Commit rendered PNG output
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.png output/index.html output/.nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Render approved Instagram posts [skip ci]"
            git push
          fi

      - name: Upload renderer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rendered-instagram-posts
          path: instagram-factory/output
          include-hidden-files: true

      - name: Configure GitHub Pages
        id: pages-configure
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.pages-configure.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: instagram-factory/output

  deploy:
    if: needs.render.outputs.pages-enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: render
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

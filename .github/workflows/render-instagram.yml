name: Render approved Instagram posts

on:
  workflow_dispatch:
  push:
    paths:
      - "instagram-factory/assets/**"
      # The inbox is a staging area handled by media-inbox.yml, which pushes to the same
      # branch. Reacting to it too made both workflows race and this one lose the push.
      - "!instagram-factory/assets/inbox/**"
      - "instagram-factory/content/**"
      - "instagram-factory/posts/**"
      - "instagram-factory/stories/**"
      - "instagram-factory/carousels/**"
      - "instagram-factory/reels/**"
      - "instagram-factory/renderer/**"
      - "instagram-factory/schemas/**"
      - "instagram-factory/scripts/**"
      - "instagram-factory/package.json"
      - "instagram-factory/pnpm-lock.yaml"
      - "instagram-factory/pnpm-workspace.yaml"
      - ".github/workflows/render-instagram.yml"
      - ".github/workflows/deploy-instagram-pages.yml"

permissions:
  contents: write

concurrency:
  group: instagram-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instagram-factory
    env:
      OUTPUT_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: instagram-factory/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Render, QA and build Pages bundle
        run: pnpm run pipeline

      - name: Commit rendered media output
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output
          if ! git diff --cached --quiet; then
            git commit -m "Render approved Instagram output"
            git push
          fi

      - name: Upload renderer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rendered-instagram-posts
          path: instagram-factory/output
          include-hidden-files: true

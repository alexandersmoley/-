name: Process media inbox

on:
  workflow_dispatch:
  push:
    paths:
      - "instagram-factory/assets/inbox/**"
      # The job commits index.json back; excluding it keeps that commit from re-arming this trigger.
      - "!instagram-factory/assets/inbox/index.json"
      - "!instagram-factory/assets/inbox/README.md"
      - ".github/workflows/media-inbox.yml"

permissions:
  contents: write

concurrency:
  group: media-inbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process:
    # Second loop guard: never react to the commit this workflow just pushed.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instagram-factory
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          # Full history so index.json can record the real commit date of each file.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: instagram-factory/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install HEIC decoder and metadata reader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libheif-examples libimage-exiftool-perl

      - name: Convert, resize, strip EXIF and rebuild index
        env:
          INBOX_BRANCH: ${{ github.ref_name }}
        run: node scripts/process-media-inbox.mjs

      - name: Verify no EXIF survived
        run: |
          set -euo pipefail
          shopt -s nullglob nocaseglob
          failed=0
          for file in assets/inbox/*.jpg assets/inbox/*.jpeg assets/inbox/*.png assets/inbox/*.webp; do
            if exiftool -s -G "$file" | grep -E '^\[(GPS|EXIF|XMP|IPTC)\]' > /dev/null; then
              echo "Metadata still present in $file"
              exiftool -s -G "$file" | grep -E '^\[(GPS|EXIF|XMP|IPTC)\]'
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Refusing to commit: metadata was not stripped."
            exit 1
          fi
          echo "No EXIF or GPS blocks found."

      - name: Commit processed media
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A instagram-factory/assets/inbox
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          # [skip ci] keeps this push from starting another render or inbox run.
          git commit -m "Process media inbox [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

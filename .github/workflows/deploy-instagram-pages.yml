name: Deploy Instagram output to Pages

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/tilde-skills-connectors-wkqjmo"
    paths:
      - "instagram-factory/output/**"
      - ".github/workflows/deploy-instagram-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Instagram output
        uses: actions/upload-pages-artifact@v4
        with:
          path: instagram-factory/output

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

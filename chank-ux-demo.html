/* Chat-first layout: retained five-section navigation, conversation is the primary workspace */
.content.chat-mode{max-width:none;margin:0;padding:0;height:calc(100dvh - 68px);min-height:420px;overflow:hidden;background:#fff}
.content.chat-mode #view{height:100%}
.content.chat-mode #feedback:not(:empty){position:absolute;z-index:5;left:50%;top:82px;transform:translateX(-50%);box-shadow:0 8px 28px #1d302626;max-width:min(480px,90vw)}
.chat-workspace{display:flex;flex-direction:column;height:100%;background:#fff;min-width:0}
.chat-topbar{height:57px;flex:none;border-bottom:1px solid #eff1ed;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 25px;color:var(--ink)}
.chat-topbar strong{font-size:15px;font-weight:700}
.chat-topbar .chat-sub{color:#7b857c;margin-left:9px;font-size:12px}
.chat-topbar .btn{background:transparent;border-color:#e5eae4}
.chat-topbar .btn:disabled{opacity:.4}
.chat-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-color:#dfe5df transparent}
.chat-thread{max-width:794px;margin:0 auto;padding:38px 22px 32px;display:flex;flex-direction:column;gap:26px;min-height:100%}
.chat-intro{text-align:center;margin:auto auto 28px;max-width:600px;padding:16px 0 0}
.chat-intro h1{font-size:clamp(27px,3vw,34px);font-weight:620;letter-spacing:-.047em;margin:0 0 10px}
.chat-intro p{font-size:14px;color:var(--muted)}
.chat-msg{width:100%;display:flex;min-width:0}
.chat-msg.user{justify-content:flex-end}
.chat-msg .chat-user-text{padding:12px 17px;border-radius:20px;background:#eef1eb;max-width:min(74%,520px);white-space:pre-wrap;line-height:1.58;overflow-wrap:anywhere}
.chat-msg.assistant{justify-content:flex-start}
.chat-msg .chat-answer{width:100%;max-width:750px;min-width:0}
.chat-answer .speaker{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:#566b5d;font-weight:700}
.chat-answer .speaker .ai-mark{width:21px;height:21px;display:grid;place-items:center;border:1px solid #c4d4c0;border-radius:7px;font-size:12px;background:#f1f5ee;color:#2f5135}
.chat-answer p{font-size:15px;line-height:1.65;white-space:pre-wrap}
.chat-choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}
.chat-choices button{border:1px solid #dce4d9;background:#fff;border-radius:15px;padding:10px 14px;text-align:left;min-height:42px;font-weight:580;color:#294634;transition:background .15s}
.chat-choices button:hover{background:#eff5ec}
.chat-empty-start{display:flex;flex-direction:column;gap:26px;margin:auto 0}
.chat-empty-start .chat-choices{justify-content:center}
.chat-empty-start .chat-choices button{background:#f9fbf7}
.wizard-message{display:flex;gap:0;min-width:0}
.wizard-message .chat-answer{width:100%;min-width:0}
.wizard-card{margin-top:8px;border:1px solid #dfe5dc;background:#fafbf8;border-radius:18px;padding:20px;max-width:700px}
.wizard-card h2{font-size:21px}
.wizard-card .form{gap:14px}
.wizard-card .form .btn{min-height:42px}
.wizard-controls{border-top:1px solid #e6eae3;display:flex;justify-content:space-between;padding-top:11px;margin-top:16px}
.wizard-controls .btn{min-width:90px}
.chat-composer-zone{flex:none;width:100%;padding:10px 22px 19px;background:#fff}
.chat-composer-inner{max-width:794px;margin:0 auto}
.chat-composer{border:1px solid #d9e1d7;border-radius:24px;box-shadow:0 3px 16px #23372c0a;background:#f8f9f6;padding:9px 9px 9px 15px;display:flex;align-items:flex-end;gap:9px}
.chat-composer:focus-within{border-color:#9aaf98;box-shadow:0 0 0 2px #ceddc84d}
.chat-composer textarea{resize:none;width:100%;min-height:47px;max-height:160px;background:transparent;border:0;outline:0;padding:13px 4px 10px;color:var(--ink);font-size:15px;line-height:1.48;box-shadow:none}
.chat-composer textarea:focus{outline:0}
.chat-composer button{flex:none;border:0;display:grid;place-items:center;cursor:pointer}
.chat-composer .attach{height:36px;width:36px;border:1px solid #e1e7de;background:white;border-radius:50%;font-size:22px;line-height:1;color:#385141;margin-bottom:5px}
.chat-composer .send{height:39px;width:39px;border-radius:50%;background:var(--pine);color:#fff;font-size:20px;line-height:1;margin-bottom:4px}
.chat-composer .send:hover{background:#345943}
.chat-footnote{text-align:center;color:#859188;font-size:11px;margin-top:8px}
@media(max-width:630px){
 .content.chat-mode{height:calc(100dvh - 52px - 52px - 63px - env(safe-area-inset-bottom));min-height:200px;padding:0}
 .chat-topbar{height:49px;padding:0 12px}
 .chat-topbar .chat-sub{display:none}
 .chat-topbar .btn{font-size:11px;padding:6px 10px;min-height:33px}
 .chat-thread{padding:22px 15px 16px;gap:21px}
 .chat-intro{margin:auto auto 20px;padding-top:10px}
 .chat-intro h1{font-size:27px}
 .chat-choices{gap:7px}
 .chat-choices button{font-size:12px;min-height:39px;padding:8px 11px}
 .chat-msg .chat-user-text{max-width:86%;padding:11px 14px}
 .chat-answer p{font-size:14px}
 .wizard-card{padding:14px;border-radius:13px}
 .wizard-card h2{font-size:19px}
 .wizard-controls .btn{font-size:12px}
 .chat-composer-zone{padding:7px 10px 7px}
 .chat-composer{border-radius:20px;padding:7px 8px 6px 9px;gap:5px}
 .chat-composer textarea{font-size:16px;padding:12px 2px 7px;min-height:47px}
 .chat-composer .attach{height:33px;width:33px;margin-bottom:5px}
 .chat-composer .send{height:36px;width:36px;margin-bottom:3px}
 .chat-footnote{font-size:10px;margin-top:4px}
}
@media(max-width:630px){
 .label input,.label select,.label textarea,select.field{font-size:16px}
 .identity{padding-top:max(11px,env(safe-area-inset-top))}
 .chat-composer .attach,.chat-composer .send{min-width:44px;min-height:44px}
 .content.chat-mode{height:calc(100vh - 167px);height:calc(100dvh - 167px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
}

<div class="shell">
<aside class="side"><div class="identity"><span class="logo-slot" aria-label="Место для оригинального логотипа 03А">03А</span><div><strong>Чанк</strong><small>Личный кабинет</small></div></div><nav class="nav" aria-label="Разделы кабинета" id="nav"></nav><div class="side-note">Макет для согласования<br>На основе кабинета v11</div></aside>
<div><header class="top"><div class="project"><span class="project-icon" id="projectIcon"></span><span id="project"></span></div><div class="top-end"><span class="badge dot" id="mode"></span><button class="btn small" id="switch"></button></div></header>
<main class="content" id="main"><div id="feedback" role="status" aria-live="polite"></div><div id="view"></div></main></div></div>
<script>
const icons={
chat:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l2-4a8.5 8.5 0 1 1 15-4.5Z"/>',
auto:'<rect x="4" y="6" width="16" height="14" rx="2"/><path d="M8 3v6m8-6v6M4 11h16m-11 4h2m3 0h2"/>',
review:'<circle cx="12" cy="12" r="8.5"/><path d="m8 12 2.5 2.5L16 9"/>',
knowledge:'<path d="M12 6c-2-2-6-2-9-1v14c3-1 7-1 9 1 2-2 6-2 9-1V5c-3-1-7-1-9 1v14"/>',
integration:'<path d="m9 7 4 4m-2-6 4 4m-2 2-2 2a4 4 0 0 1-6-6l2-2m7 6 2-2a4 4 0 0 1 6 6l-2 2m-7 0 4 4m-2-6 4 4" transform="translate(-1 -1)"/>',
site:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18m-13 6h8"/>',
file:'<path d="M6 3h8l4 4v14H6zm8 0v5h4M9 12h6m-6 4h6"/>',
bolt:'<path d="m13 2-8 12h6l-1 8 9-12h-6z"/>',
project:'<path d="M3 6h7l2 2h9v12H3z"/>'
};
const svg=id=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[id]+'</svg>';
const glyph=id=>'<span class="glyph">'+svg(id)+'</span>';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const nav=[['chat','Чат','Чат'],['auto','Автоматизации','Сценарии'],['review','На проверке','Проверка'],['knowledge','База знаний','База'],['integration','Интеграции','Интеграции']];
const types={site:'Актуализировать сайт',blog:'Вести блог',once:'Разовая задача'};
const modes={now:'Сейчас',date:'Один раз по дате',recurring:'Регулярно'};
const zones=['Екатеринбург · UTC+5','Москва · UTC+3','UTC'];
const outcomes={normal:'Обычный путь',source:'Источник недоступен',cms:'CMS недоступна',conflict:'Конфликт версии',partial:'Частичный успех'};
const action=(id,label,style='',attr='')=>'<button type="button" class="btn '+style+'" data-action="'+id+'" '+attr+'>'+label+'</button>';
const badge=(label,kind='')=>'<span class="badge '+kind+'">'+label+'</span>';
const panel=(content,cls='')=>'<section class="card '+cls+'">'+content+'</section>';
const empty=(title,p,cta='')=>panel('<div class="empty"><h2>'+title+'</h2><p class="muted">'+p+'</p>'+(cta?'<div class="actions" style="justify-content:center">'+cta+'</div>':'')+'</div>');
const heading=(title,p='',cta='')=>'<div class="heading"><div><h1 tabindex="-1" class="screen-title">'+title+'</h1>'+(p?'<p>'+p+'</p>':'')+'</div>'+cta+'</div>';
const rules=rows=>'<dl class="rules">'+rows.map(([k,v])=>'<div><dt>'+k+'</dt><dd>'+v+'</dd></div>').join('')+'</dl>';
const state={section:'chat',demo:false,wizard:null,paused:false,scenario:null,run:null,decision:null,history:[],outcome:'normal',integrationReturn:false,factOpen:false,messages:[],chatDraft:''};
function sampleDate(offset=1){const now=new Date();now.setUTCDate(now.getUTCDate()+offset);return now.toISOString().slice(0,10)}
function draft(type){return {type,title:types[type],page:type==='blog'?'/blog':'/delivery',source:'Условия доставки · v4',mode:type==='once'?'now':'recurring',date:sampleDate(),time:'09:00',zone:zones[0],frequency:'Каждую неделю',editor:'Редактор проекта',step:0,furthest:0}}
function dateLabel(d){if(d.mode==='now')return 'По ручному запуску';const [y,m,day]=d.date.split('-');return day+'.'+m+'.'+y+' в '+d.time+' · '+d.zone;}
function announce(msg){const f=$('#feedback');f.textContent=msg;f.className=msg?'callout ok':'';if(msg)f.style.marginBottom='12px';else f.style.marginBottom='0';}
function focusHeading(){requestAnimationFrame(()=>$('.screen-title')?.focus({preventScroll:true}));}
function show(section){state.section=section;announce('');render();window.scrollTo(0,0);focusHeading();}
function goWizard(step){state.wizard.step=step;state.wizard.furthest=Math.max(step,state.wizard.furthest);render();requestAnimationFrame(()=>{$('#step-title')?.focus({preventScroll:true});const feed=$('#chat-scroll');if(feed)feed.scrollTop=feed.scrollHeight;});}
function quick(id,name,sub,icon){return '<button type="button" data-action="'+id+'">'+glyph(icon)+'<span><strong>'+name+'</strong><small>'+sub+'</small></span></button>';}
function samplePanel(){return panel('<h2>Проверка макета</h2><p class="muted">Переключайте состояния на синтетических данных.</p><label class="label" style="margin-top:10px">Состояние<select id="outcome">'+Object.entries(outcomes).map(([k,v])=>'<option value="'+k+'" '+(state.outcome===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label><details style="margin-top:12px"><summary>Варианты шапки</summary><div class="brand-compare"><div class="sample">Зелёный v11<i></i></div><div class="sample alt">Графит<i></i></div></div></details>','rail');}
function homeRail(){return panel('<h2>'+ (state.demo?'Проект «Север»':'Рабочая область')+'</h2>'+rules([['Сценарии',state.scenario?'1':'0'],['На проверке',state.run?.status==='review'?'1':'0'],['Интеграции','Не подключены']])+ '<div class="actions">'+action('integration','Посмотреть интеграции','quiet small')+'</div>','rail');}
function message(role,text){return '<div class="chat-msg '+role+'">'+(role==='user'?'<div class="chat-user-text">'+esc(text)+'</div>':'<div class="chat-answer"><div class="speaker"><span class="ai-mark">ч</span>Чанк</div><p>'+esc(text)+'</p></div>')+'</div>';}
function chatChoices(){return '<div class="chat-choices">'+action('start:site','Проверить актуальность сайта')+action('start:blog','Подготовить статьи в блог')+action('start:once','Разовая задача')+(state.demo?action('demo-run','Учебный сценарий'):action('demo','Открыть демопроект'))+'</div>';}
function chat(){
 const initial=state.messages.length===0&&!state.wizard;
 const greeting=initial?'<div class="chat-empty-start"><div class="chat-intro"><h1 class="screen-title" tabindex="-1">Что будем делать с контентом?</h1><p>Опишите задачу своими словами или выберите готовый сценарий.</p></div>'+chatChoices()+'</div>':'';
 const messages=state.messages.map(m=>message(m.role,m.text)).join('');
 const wizardMessage=state.wizard?'<div class="wizard-message"><div class="chat-answer"><div class="speaker"><span class="ai-mark">ч</span>Чанк · настройка сценария</div>'+wizard()+'</div></div>':'';
 const suggestions=!initial&&!state.wizard&&state.messages.length?'<div class="chat-choices">'+action('start:site','Обновлять сайт')+action('start:blog','Вести блог')+action('start:once','Разовая задача')+action('auto','Мои автоматизации')+'</div>':'';
 return '<section id="chat-workspace" class="chat-workspace" aria-label="Чат с Чанком"><div class="chat-topbar"><div><strong>Чанк</strong><span class="chat-sub">Работа с контентом компании</span></div>'+action('new-chat','+ Новый чат','small',state.wizard?'disabled title="Сначала завершите настройку сценария"':'')+'</div><div id="chat-scroll" class="chat-scroll"><div class="chat-thread">'+greeting+messages+wizardMessage+suggestions+'</div></div><div class="chat-composer-zone"><div class="chat-composer-inner"><form class="chat-composer" id="chat-composer"><button type="button" class="attach" data-action="attach-source" aria-label="Открыть базу знаний" title="Источники компании">+</button><textarea id="chat-prompt" name="prompt" rows="1" placeholder="Напишите задачу Чанку…" aria-label="Сообщение Чанку">'+esc(state.chatDraft)+'</textarea><button type="submit" class="send" aria-label="Отправить сообщение" title="Отправить">↑</button></form><div class="chat-footnote">UX-демо · ответы по готовым сценариям, AI не подключён</div></div></div></section>';
}
function sendChat(){
 const input=$('#chat-prompt');const value=(input?.value||'').trim();if(!value)return;
 state.messages.push({role:'user',text:value});state.chatDraft='';
 const q=value.toLowerCase();let response='В этом макете пока нет подключения к AI. Могу показать настройку сайта, блога или разовой задачи с понятными шагами.';
 if(state.wizard){response='Сейчас мы настраиваем сценарий. Завершите шаги ниже; введённые параметры останутся в форме.';}
 else if(/блог|стать|контент.?план|публикац/.test(q)){response='Подготовим сценарий работы с блогом. Выберите источники, частоту и порядок согласования.';state.wizard=draft('blog');}
 else if(/сайт|обнов|актуал|страниц|цен|доставк/.test(q)){response='Настроим проверку страниц и подготовку правок. Публикация будет требовать отдельного решения.';state.wizard=draft('site');}
 else if(/разов|один раз|проверить текст/.test(q)){response='Создадим разовый сценарий. Можно будет сохранить его без расписания.';state.wizard=draft('once');}
 else if(/интеграц|cms|тильд|метрик|wordstat/.test(q)){response='Откройте интеграции. В демоверсии подключения отсутствуют — это будет явно показано.';}
 else if(/провер|соглас/.test(q)){response='Все решения редактора находятся в разделе «На проверке». Там отображается сравнение до и после правки.';}
 state.messages.push({role:'assistant',text:response});render();requestAnimationFrame(()=>{$('#chat-prompt')?.focus({preventScroll:true});const f=$('#chat-scroll');if(f)f.scrollTop=f.scrollHeight;});
}
function labelInput(k,name,type='text'){return '<label class="label">'+name+'<input name="'+k+'" type="'+type+'" required value="'+esc(state.wizard[k])+'"></label>';}
function select(k,name,values){return '<label class="label">'+name+'<select name="'+k+'">'+values.map(v=>'<option '+(state.wizard[k]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select></label>';}
function wizard(){
 const w=state.wizard, names=['Что делать?','Где и по какому источнику?','Когда запускать?','Кто утверждает?','Проверьте сценарий'], buttons=action('back','← Назад','quiet small',w.step===0?'disabled':'')+action('forward','Вперёд →','quiet small',w.step>=w.furthest?'disabled':'');
 let form='';
 if(w.step===0)form=labelInput('title','Название сценария')+'<div class="tabs" aria-label="Задача">'+Object.entries(types).map(([id,name])=>action('type:'+id,name,'small','aria-pressed="'+(id===w.type)+'"')).join('')+'</div>';
 if(w.step===1)form=labelInput('page','Страница или раздел')+labelInput('source','Источник')+'<div class="callout"><strong>CMS не подключена</strong><br><small>Сохранить сценарий можно без доступа. В макете проверка использует учебные данные.</small><div class="actions">'+action('check-integrations','Проверить интеграции','small')+'</div></div>';
 if(w.step===2)form='<div class="tabs" aria-label="Режим запуска">'+Object.entries(modes).map(([id,name])=>action('mode:'+id,name,'small','aria-pressed="'+(id===w.mode)+'"')).join('')+'</div>'+(w.mode==='now'?'<p class="muted">Запуск начнётся после подтверждения.</p>':'<div class="split">'+labelInput('date',w.mode==='date'?'Дата':'Первый запуск','date')+labelInput('time','Время','time')+'</div>'+select('zone','Часовой пояс',zones)+(w.mode==='recurring'?select('frequency','Повтор',['Каждый день','Каждую неделю','Каждый месяц']):''));
 if(w.step===3)form=select('editor','Кто проверяет изменения',['Редактор проекта','Владелец проекта'])+'<div class="callout">Изменение страницы требует решения редактора.</div>';
 if(w.step===4)form=rules([['Сценарий',esc(w.title)],['Страница',esc(w.page)],['Источник',esc(w.source)],['Когда',modes[w.mode]],...(w.mode==='now'?[]:[['Следующий запуск',esc(dateLabel(w))]]),['Кто утверждает',esc(w.editor)]])+'<div class="callout">Результат — правка с источником и сравнением версий. Здесь запуск моделируется.</div>';
 return '<div class="wizard-card"><ol class="stepbar" aria-label="Шаг '+(w.step+1)+' из 5">'+names.map((_,i)=>'<li class="'+(i<=w.step?'done':'')+'"></li>').join('')+'</ol><div class="card-head"><div><small>Шаг '+(w.step+1)+' из 5</small><h2 id="step-title" tabindex="-1">'+names[w.step]+'</h2></div>'+action('cancel','Закрыть','quiet small')+'</div><form id="wizard" class="form" style="margin-top:12px">'+form+'<p class="field-note" id="field-error" role="alert" hidden></p><div class="actions" style="margin:0">'+(w.step<4?'<button type="submit" class="btn primary">Продолжить</button>':action('save','Сохранить черновик')+action('activate',w.mode==='now'?'Смоделировать запуск':'Активировать в демо','primary'))+'</div></form><div class="wizard-controls">'+buttons+'</div></div>';
}
function automation(){const s=state.scenario,r=state.run;const c=s?'<div class="stack">'+panel('<div class="card-head"><div><small>Сценарий</small><h2>'+esc(s.title)+'</h2><p class="muted">'+esc(s.page)+'</p></div>'+badge(state.paused?'На паузе':s.active?'Активирован в демо':'Черновик',state.paused?'warn':'')+'</div>'+rules([['Режим',modes[s.mode]],['Следующий запуск',state.paused?'На паузе':s.active?esc(dateLabel(s)):'После активации'],['Повтор',s.mode==='recurring'?esc(s.frequency):'Один запуск']])+ '<div class="actions">'+action('run','Смоделировать запуск','primary')+(s.active&&s.mode!=='now'?action('pause',state.paused?'Возобновить':'Поставить на паузу'):'')+action('edit','Изменить')+'</div>')+(r?runCard():empty('Запусков ещё нет','История появится после первого запуска.'))+(state.history.length?panel('<h2>Предыдущие запуски</h2><ol class="timeline">'+state.history.map(x=>'<li>'+esc(x.time)+' · '+esc(runLabels[x.status])+'</li>').join('')+'</ol>'):'')+'</div>':empty('Сценариев пока нет','Выберите задачу в чате и сохраните сценарий.',action('start:site','Создать сценарий','primary'));return heading('Автоматизации','Сценарии, расписание и история запусков')+'<div class="layout">'+c+'<aside class="stack">'+(state.demo?samplePanel():homeRail())+'</aside></div>';}
const runLabels={review:'Ждёт проверки',source:'Ошибка источника',cms:'Ошибка CMS',approved:'Решение принято',returned:'На доработке',partial:'Частичный успех',conflict:'Конфликт версии',checking:'Проверяем результат',unknown:'Результат не подтверждён',confirmed:'Подтверждено в демо'};
function runCard(){const r=state.run;let extra='';if(r.status==='review')extra=action('review','Открыть правку','primary');if(r.status==='source')extra=action('knowledge','Открыть источник')+action('retry','Повторить в демо','primary');if(r.status==='cms')extra=action('integration','Проверить доступ')+action('retry-cms','Проверить результат','primary');if(r.status==='approved')extra=action('review','Открыть принятое решение');if(r.status==='partial')extra=action('retry-cms','Проверить результат');if(r.status==='conflict')extra=action('review','Сверить с новой версией','primary');return panel('<div class="card-head"><div><small>Учебный запуск · '+esc(r.time)+'</small><h2>Проверка страницы</h2></div>'+badge(runLabels[r.status],['source','cms','conflict'].includes(r.status)?'error':r.status==='partial'?'warn':'')+'</div><ol class="timeline">'+r.log.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>'+(extra?'<div class="actions">'+extra+'</div>':''));}
function review(){
 const r=state.run;let c;
 if(!r||r.status==='source'){c=empty('Очередь пуста',r?'Проверка источника завершилась ошибкой. Правка не создана.':'Правки появятся здесь после проверки страницы.',action('auto','К сценариям'));}
 else{const changed=r.status==='conflict', done=state.decision;const v=r.version;
 const b=changed?'<div class="callout warn" role="alert"><strong>На странице уже версия '+(v+1)+'.</strong> Сверьте текущий текст и подготовьте предложение заново.</div>':'';
 const publish={approved:'Не отправлено',returned:'На доработке',cms:'Ошибка CMS',partial:'Отправлено в CMS, чтение результата не завершено',checking:'Проверяем результат',unknown:'Результат не подтверждён',confirmed:'Подтверждено в демо'};
 const compare='<div class="compare"><div><h3>Было · v'+v+'</h3><p>'+(v>3?'Доставка занимает до 4 рабочих дней.':'Доставка занимает до 7 рабочих дней.')+'</p></div><div><h3>Предлагается</h3><p>Доставка занимает до 5 рабочих дней.</p></div></div>';
 const controls=changed?action('refresh-version','Обновить сравнение','primary'):!done?action('approve','Утвердить правку','primary')+action('return-review','На доработку'):r.status==='approved'?action('publish','Смоделировать размещение','primary'):['cms','partial','unknown'].includes(r.status)?action('retry-cms','Проверить результат','primary'):'';
 c=panel('<div class="stack"><div class="card-head"><div><h2>Срок доставки</h2><p class="url muted">https://sever.example'+esc(state.scenario.page)+'</p></div>'+badge(done==='yes'?'Утверждена':done==='no'?'На доработке':'1 правка',done==='no'?'warn':'')+'</div>'+rules([['Источник',esc(state.scenario.source)],['Версия страницы','v'+v],['Решение редактора',done==='yes'?'Правка утверждена':done==='no'?'На доработке':'Ожидается'],['Публикация',publish[r.status]||'Ожидает согласования']])+b+(['cms','partial','unknown'].includes(r.status)?'<div class="callout warn" role="status">Результат записи неизвестен. Проверьте текущую версию страницы перед любым новым размещением.</div>':'')+compare+(controls?'<div class="actions" style="margin:0">'+controls+'</div>':'')+'</div>');}
 return heading('На проверке','Решения редактора и статус размещения')+'<div class="layout"><div class="stack">'+c+'</div><aside class="stack">'+(state.demo?samplePanel():homeRail())+'</aside></div>';
}
function knowledge(){const demo=state.demo;return heading('База знаний','Источники, факты и связанные страницы')+'<div class="layout"><div class="stack">'+(demo?panel('<div class="card-head"><div><small>Факт · доставка</small><h2>Срок доставки</h2><p>До 5 рабочих дней</p></div>'+badge(state.outcome==='source'?'Источник недоступен':'Проверен',state.outcome==='source'?'warn':'')+'</div>'+rules([['Источник','Условия доставки · v4'],['Проверка','12 ноября 2026'],['Связанная страница','/delivery']])+'<div class="actions">'+action('fact',state.factOpen?'Свернуть источник':'Сведения об источнике')+'</div>'+(state.factOpen?'<p class="callout" style="margin-top:10px">Учебный документ отдела логистики. В демо источник не загружается из внешней системы.</p>':'')):empty('Фактов пока нет','Укажите источник в сценарии. Учебный факт можно открыть в демопроекте.',action('demo','Открыть демопроект')))+panel('<h2>Правила бренда</h2><p class="muted">'+(demo?'В учебном проекте правила ещё не добавлены.':'Нет редполитики, ToV и брендбука.')+'</p>')+'</div><aside class="stack">'+homeRail()+'</aside></div>';}
function integrations(){const systems=[['CMS','Чтение страницы и её версии','Запись утверждённого изменения'],['Wordstat','Чтение данных о запросах','Запись не требуется'],['Яндекс Метрика','Чтение показателей страниц','Запись не требуется'],['AI-провайдер','Чтение статуса доступа и лимитов','Подготовка текста по запросу']];return heading('Интеграции','Доступы для сценариев',state.integrationReturn?action('return-wizard','← Вернуться к сценарию','primary'):'')+'<div class="layout"><div class="stack">'+systems.map(([n,r,w])=>panel('<div class="card-head"><div class="row">'+glyph('integration')+'<h2>'+n+'</h2></div>'+badge('Не подключено','warn')+'</div>'+rules([['Чтение',r],['Запись',w]]))).join('')+'</div><aside class="stack">'+panel('<h2>Доступы в макете</h2><p class="muted">Внешние системы отключены. Все сценарии используют синтетические данные.</p>','rail')+'</aside></div>';}
function render(){
 const count=state.run?.status==='review'?1:0;
 $('#nav').innerHTML=nav.map(([id,label,short])=>'<button type="button" data-action="'+id+'" aria-label="'+label+'" '+(state.section===id?'aria-current="page"':'')+'>'+svg(id)+'<span class="desktop-label">'+label+'</span><span class="mobile-label">'+short+'</span>'+(id==='review'&&count?'<span class="count" aria-hidden="true">'+count+'</span>':'')+'</button>').join('');
 $('#projectIcon').innerHTML=svg('project');$('#project').textContent=state.demo?'Проект «Север»':'Новый проект';$('#mode').textContent=state.demo?'Демопроект':'Макет';$('#switch').textContent=state.demo?'Пустой проект':'Демо';$('#switch').dataset.action=state.demo?'reset':'demo';
 $('#main').classList.toggle('chat-mode',state.section==='chat');
 $('#view').innerHTML=({chat,auto:automation,review,knowledge,integration:integrations}[state.section])();
 if(state.section==='chat'){requestAnimationFrame(()=>{const f=$('#chat-scroll');if(!f)return;const w=document.querySelector('.wizard-message');if(w){f.scrollTop += w.getBoundingClientRect().top - f.getBoundingClientRect().top - 16;}else{f.scrollTop=f.scrollHeight;}});}
}
function enableDemo(){state.demo=true;}
function reset(demo){Object.assign(state,{demo,wizard:null,scenario:null,run:null,decision:null,history:[],paused:false,outcome:'normal',integrationReturn:false,factOpen:false,messages:[],chatDraft:''});show('chat');}
function persistFields(e){const w=state.wizard;if(w&&e.target.form?.id==='wizard'&&e.target.name in w)w[e.target.name]=e.target.value;}
document.addEventListener('input',e=>{persistFields(e);if(e.target.id==='chat-prompt')state.chatDraft=e.target.value;});
document.addEventListener('keydown',e=>{if(e.target.id==='chat-prompt'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}});
document.addEventListener('change',e=>{persistFields(e);if(e.target.id==='outcome'){state.outcome=e.target.value;announce('Состояние примера изменено. Оно применяется при следующем действии.');}});
function checkStep(){const f=$('#wizard'),w=state.wizard;if(!f?.reportValidity())return false;if((w.step===0&&!w.title.trim())||(w.step===1&&(!w.page.trim()||!w.source.trim()))){const msg=$('#field-error');msg.hidden=false;msg.textContent='Заполните поля перед продолжением.';f.querySelector('input').focus();return false;}return true;}
document.addEventListener('submit',e=>{if(e.target.id==='chat-composer'){e.preventDefault();sendChat();return;}if(e.target.id==='wizard'){e.preventDefault();if(checkStep()&&state.wizard.step<4)goWizard(state.wizard.step+1);}});
function launch(){enableDemo();if(state.run)state.history.unshift(state.run);state.decision=null;state.run={time:new Intl.DateTimeFormat('ru-RU',{dateStyle:'short',timeStyle:'short'}).format(new Date()),status:state.outcome==='source'?'source':'review',version:3,log:['Учебный запуск начат',state.outcome==='source'?'Источник не ответил. Правка не создана.':'Найдено одно изменение. Правка ждёт решения редактора.']};show('auto');}
function publish(){
 const run=state.run;
 run.status=state.outcome==='cms'?'cms':state.outcome==='partial'?'partial':'checking';
 run.log.push(run.status==='cms'?'Учебная CMS не ответила на отправку.':'Правка отправлена в учебную CMS.');
 render();announce(runLabels[run.status]);
 if(run.status==='checking')reconcile(run);
}
function reconcile(run=state.run){
 if(!['checking','cms','partial','unknown'].includes(run.status))return;
 run.status='checking';
 const readAvailable=state.outcome!=='cms';
 run.log.push('Проверяем текущую версию страницы без повторной записи.');
 render();announce(runLabels.checking);
 setTimeout(()=>{
   if(state.run!==run)return;
   run.status=readAvailable?'confirmed':'unknown';
   run.log.push(readAvailable?'Чтение учебной страницы подтвердило правку.':'Учебная CMS недоступна. Результат записи остаётся неизвестным.');
   render();announce(runLabels[run.status]);
 },650);
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 const [id,arg]=b.dataset.action.split(':');
 const w=state.wizard;
 if(nav.some(([key])=>key===id)){show(id);return;}
 switch(id){
 case 'start': state.messages.push({role:'user',text:types[arg]});state.messages.push({role:'assistant',text:'Настроим сценарий. Заполните шаги ниже — затем можно сохранить черновик или выбрать запуск.'});state.wizard=draft(arg);show('chat');break;
 case 'new-chat': if(!state.wizard){state.messages=[];state.chatDraft='';show('chat');}break;
 case 'attach-source': show('knowledge');break;
 case 'back': goWizard(w.step-1);break;
 case 'forward': if(checkStep())goWizard(w.step+1);break;
 case 'type': if(w.title===types[w.type])w.title=types[arg];w.type=arg;render();document.querySelector('[data-action="type:'+arg+'"]').focus();break;
 case 'mode': w.mode=arg;render();document.querySelector('[data-action="mode:'+arg+'"]').focus();break;
 case 'cancel': state.wizard=null;state.integrationReturn=false;show('chat');break;
 case 'check-integrations': state.integrationReturn=true;show('integration');break;
 case 'return-wizard': state.integrationReturn=false;show('chat');requestAnimationFrame(()=>$('#step-title').focus());break;
 case 'demo': reset(true);break;
 case 'reset': reset(false);break;
 case 'demo-run': state.messages.push({role:'user',text:'Открыть учебный сценарий'});state.messages.push({role:'assistant',text:'Проверим страницу доставки по условиям из демонстрационного источника.'});state.wizard=draft('site');show('chat');break;
 case 'save': case 'activate': if(state.run&&state.scenario?.title!==w.title){state.history.unshift(state.run);state.run=null;state.decision=null;}state.scenario={...w,active:id==='activate'};state.wizard=null;state.paused=false;state.integrationReturn=false;if(id==='activate')enableDemo();if(id==='activate'&&w.mode==='now'){launch();}else{show('auto');announce(id==='save'?'Черновик сохранён на время просмотра макета.':'Расписание активно в демо. Используйте «Смоделировать запуск», чтобы пройти дальше.');}break;
 case 'edit': state.wizard={...state.scenario,step:0,furthest:4};show('chat');break;
 case 'pause': state.paused=!state.paused;render();announce(state.paused?'Расписание поставлено на паузу.':'Расписание возобновлено.');$('[data-action="pause"]')?.focus();break;
 case 'run': launch();break;
 case 'retry': state.outcome='normal';launch();break;
 case 'approve': if(state.outcome==='conflict'&&state.run.version===3){state.run.status='conflict';state.run.log.push('Версия страницы изменилась перед согласованием.');render();announce('Обнаружен конфликт версии.');}else{state.decision='yes';state.run.status='approved';state.run.log.push('Редактор утвердил правку.');render();announce('Правка утверждена.');}break;
 case 'return-review': state.decision='no';state.run.status='returned';state.run.log.push('Редактор вернул правку на доработку.');render();announce('Правка отправлена на доработку.');break;
 case 'refresh-version': state.run.version++;state.run.status='review';render();announce('Сравнение обновлено. Проверьте правку ещё раз.');break;
 case 'publish': publish();break;
 case 'retry-cms': reconcile();break;
 case 'fact': state.factOpen=!state.factOpen;render();$('[data-action="fact"]')?.focus();break;
 }
});
render();
</script></body></html>
